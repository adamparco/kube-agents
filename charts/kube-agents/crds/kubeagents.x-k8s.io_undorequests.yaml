---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: undorequests.kubeagents.x-k8s.io
spec:
  group: kubeagents.x-k8s.io
  names:
    categories:
      - kube-agents
    kind: UndoRequest
    listKind: UndoRequestList
    plural: undorequests
    shortNames:
      - undo
    singular: undorequest
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: The action being reversed
          jsonPath: .spec.actionRef.name
          name: Action
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - description: The reverse action's ID
          jsonPath: .status.undoActionId
          name: Undo
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description:
            UndoRequest asks the undo controller to reverse one recorded
            action.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                UndoRequestSpec is the request body. Every field is immutable after creation.

                Immutability is not tidiness. `status` records what was done in response to `spec`, and a spec
                that can be repointed at a different ActionRecord after the fact produces an object whose status
                describes an undo of something it no longer references — which is precisely the object a human
                reads when reconstructing an incident.
              properties:
                actionRef:
                  description:
                    ActionRef is the ActionRecord to reverse, in this request's
                    own namespace.
                  properties:
                    name:
                      description:
                        Name is the ActionRecord's name — the `ar-<lowercased
                        action id>` form of 06 §4.3.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                markContested:
                  default: true
                  description: |-
                    MarkContested also marks the target contested, so the agent does not simply redo the change.
                    Default TRUE.

                    Default-true because the common case is a human reversing something an agent decided to do,
                    and an agent whose reasoning produced that change once will produce it again on the next
                    reconcile. Undo without the marker is a loop: the human undoes, the agent redoes, and the
                    human concludes the brake does not work. Setting it false is for the rarer case where the
                    change was right and the timing was wrong.
                  type: boolean
                reason:
                  description: |-
                    Reason is why the action is being reversed. Required, and recorded on the resulting undo
                    action — it is the only part of an incident timeline that says what the human was thinking.
                  maxLength: 512
                  minLength: 1
                  type: string
                requestedBy:
                  description: |-
                    RequestedBy is the canonical platform-qualified principal (06 §1.2 V-11) asking for the undo,
                    checked against the originating agent's `allowedUsers`.

                    The `k8s:` platform is accepted here and not only `slack:`/`googlechat:` because 06 §4.4
                    requires undo to work through `kubectl` with chat down. A human running `kubectl apply` has a
                    Kubernetes username and no Slack ID, and a schema that could not express that identity would
                    make the API brake unusable in the exact failure it is specified for.
                  maxLength: 253
                  minLength: 3
                  pattern: ^(slack|googlechat|k8s):\S+$
                  type: string
              required:
                - actionRef
                - reason
                - requestedBy
              type: object
              x-kubernetes-validations:
                - message:
                    "an UndoRequest spec is immutable: create a new request rather
                    than repointing one whose status already describes a different action"
                  rule: self == oldSelf
            status:
              description: UndoRequestStatus is what the undo controller did about it.
              properties:
                completionTime:
                  description:
                    CompletionTime is when the request reached a terminal
                    phase.
                  format: date-time
                  type: string
                conditions:
                  description: Conditions follow the standard Kubernetes convention.
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                message:
                  description:
                    Message is the human-readable outcome, including the
                    reason for a `Refused`.
                  maxLength: 1024
                  type: string
                observedGeneration:
                  description:
                    ObservedGeneration is the spec generation this status
                    was computed from.
                  format: int64
                  type: integer
                phase:
                  description: Phase is the lifecycle position.
                  enum:
                    - Pending
                    - Executing
                    - Executed
                    - Failed
                    - Refused
                  type: string
                undoActionId:
                  description: |-
                    UndoActionID is the ULID of the reverse action the broker executed, once it exists. It is the
                    forward half of the 06 §4.3 undo linkage, whose reverse half is `undoneBy` on the original
                    record — two pointers rather than one because "was this ever undone?" and "what did this undo?"
                    are asked from opposite ends and neither can be answered by scanning.
                  maxLength: 26
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
