{{- /*
The self-improvement loop (docs/designs/self-improvement.md).

Everything here is inside one `if .Values.selfImprovement.enabled`, so an install
that leaves the feature off gets no ServiceAccount, no RBAC, no CronJob and no
NetworkPolicy from it. That is the isolation requirement expressed as a render
condition rather than as a runtime flag: off means absent, not present-and-idle.

The second GitHub identity is in self-improvement-minter.yaml, rendered only for
the fork and upstream modes.
*/ -}}
{{- if .Values.selfImprovement.enabled }}
{{- $si := .Values.selfImprovement }}
{{- $ns := .Release.Namespace }}
{{- $name := "kube-agents-selfimprove" }}
{{- $mode := $si.mode | default "report-only" }}
{{- if not (has $mode (list "report-only" "fork" "upstream")) }}
{{- fail (printf "selfImprovement.mode must be report-only, fork or upstream; got %q" $mode) }}
{{- end }}
{{- $needsForge := ne $mode "report-only" }}
{{- if and $needsForge (not $si.github.forkRepo) }}
{{- fail (printf "selfImprovement.mode=%s needs selfImprovement.github.forkRepo: branches are pushed to a fork, never to the upstream repository" $mode) }}
{{- end }}
{{- $project := .Values.platformAgent.harness.projectId }}
{{- $agentImage := include "kube-agents.imageRepository" (dict "repository" .Values.platformAgent.deployment.image.repository "root" $) }}
{{- $agentTag := .Values.platformAgent.deployment.image.tag | default .Chart.AppVersion }}
{{- /*
The observed Deployment. The operator names the agent Deployment
`<PlatformAgent name>-gateway`, so this default tracks platformAgent.name rather
than being hardcoded -- an install that renamed its agent would otherwise have
every run abort on a Deployment that does not exist.
*/ -}}
{{- $observed := $si.observedDeployment | default (printf "%s-gateway" .Values.platformAgent.name) }}
{{- $ledgerName := $si.ledgerConfigMap | default "kube-agents-selfimprove-ledger" }}
{{- $modelEndpoint := $si.model.endpoint | default (printf "http://litellm.%s.svc.cluster.local/v1" $ns) }}
---
# The runner's own Kubernetes identity. Not the agent's: the agent's KSA is
# bound to cluster-admin-adjacent grants and to a Workload Identity GSA that can
# reach every managed cluster, and the whole design of this loop is that it
# holds neither. The Workload Identity annotation is what makes the GCP side of
# that true -- the GSA behind it holds logging/trace/monitoring viewer and no
# container.* role at all (terraform/modules/kube-agents-selfimprove).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $si.github.ksaName | default $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
  {{- if $project }}
  annotations:
    iam.gke.io/gcp-service-account: {{ printf "%s@%s.iam.gserviceaccount.com" ($si.github.gsaName | default "kubeagents-selfimprove") $project }}
  {{- end }}
---
# Read the namespace. `view` is the upstream ClusterRole, bound with a
# RoleBinding rather than a ClusterRoleBinding so the grant stops at this
# namespace: the runner can see the installation it is auditing and nothing
# else in the cluster, and nothing at all in the clusters under management.
#
# `view` deliberately excludes Secrets, which is the property that lets this be
# switched on without a credential review. It also excludes pods/exec,
# pods/attach and pods/portforward, so there is no route from a read grant to a
# shell in the agent's pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-view
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: {{ $si.github.ksaName | default $name }}
    namespace: {{ $ns }}
---
# The two grants `view` does not cover.
#
# The custom resources, because `view` aggregates only what carries the
# `rbac.authorization.k8s.io/aggregate-to-view` label and this project's CRDs do
# not. Reading them is most of how the loop tells what the install was asked to
# do, as against what it did.
#
# And write on exactly one ConfigMap, by name. `resourceNames` is the whole
# point: a `configmaps: [patch]` grant without it would let the runner rewrite
# the agent's own configuration, which is the one privilege escalation this
# design cannot tolerate. `create` cannot be scoped by name -- the API server
# ignores resourceNames on create, since the name is not known until the
# request is made -- so it is granted separately and is only ever exercised on
# the first run of an install whose chart did not render the ConfigMap below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
rules:
  # kubeagents.x-k8s.io, not agent.kubeagents.x-k8s.io. The group is set by
  # k8s-operator/api/v1alpha1/groupversion_info.go and appears in the CRDs under
  # charts/kube-agents/crds/. A wrong group here does not fail validation or
  # binding -- it grants nothing, and the loop's `k8s platformagents` and
  # `k8s agentplugins` evidence commands 403 on every run.
  - apiGroups: ["kubeagents.x-k8s.io"]
    resources: ["platformagents", "platformagents/status", "agentplugins", "agentplugins/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $ledgerName | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $si.github.ksaName | default $name }}
    namespace: {{ $ns }}
---
# The ledger. Rendered with NO `data` key on purpose: Helm's three-way merge
# leaves a field alone when it is absent from both the old and the new manifest,
# so the runner's writes survive every `helm upgrade`. Rendering an empty
# `data: {}` instead would reset the occurrence counts on each upgrade, and
# since promotions are gated on those counts, the loop would then never promote
# anything on an install that is upgraded regularly.
#
# It is deliberately not referenced by the agent's Deployment. The operator
# SHA256-hashes the ConfigMaps it owns into the agent pod template, so a ledger
# in that set would restart the Platform Agent every hour -- the observer
# perturbing the thing it observes, hourly, forever.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ledgerName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
---
# The runner's Hermes managed config: the model, and nothing else.
#
# HERMES_MANAGED_DIR overlays this on top of the profile config baked into the
# image (agents/selfimprove/config.yaml), which is why the model block is not in
# that file -- it would hardcode this install's namespace into the image, the
# way agents/cluster/config.yaml still does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
data:
  config.yaml: |
    model:
      provider: custom
      model: {{ $si.model.name | default "model-default" }}
      default: {{ $si.model.name | default "model-default" }}
      base_url: {{ $modelEndpoint }}
      api_key: none
{{- if $si.networkPolicy }}
---
# Egress only, and only to what an investigation needs: DNS, the model endpoint,
# the Kubernetes API, the GKE metadata server for a Workload Identity token, and
# HTTPS for the Google Cloud read APIs plus the source tarball.
#
# There is no ingress rule at all, which is not an omission: nothing should ever
# connect TO the runner. A NetworkPolicy selecting a pod with no ingress rules
# denies all ingress, so the empty list is the statement.
#
# What this cannot restrict is the 443 rule. Logging, Trace, Monitoring, GitHub
# and the model all live behind addresses that are not stable CIDRs, so the
# egress allowance is wide and the actual restriction is the IAM behind it: a
# GSA with three viewer roles cannot write to Cloud Logging however open the
# network is. Say that out loud rather than implying the policy is the control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-policy
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
spec:
  podSelector:
    matchLabels:
      kubeagents.x-k8s.io/selfimprove: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS. Both shapes of kube-dns selector, because which one matches depends
    # on the cluster's DNS provider -- the same belt-and-braces the minter
    # policy uses, and for the same reason.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The model endpoint, in-namespace.
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # GKE metadata server: the Workload Identity token exchange, and the
    # instance identity the evidence CLI reads its project from.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 988
    # Google Cloud read APIs, the source tarball, and (in fork/upstream mode)
    # GitHub. See the note above about why the IAM behind this is the control.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
spec:
  schedule: {{ $si.schedule | default "0 * * * *" | quote }}
  # A run that overruns its hour must not be joined by the next one. Two
  # investigations at once would double the model spend, race each other's
  # ledger writes, and -- worse -- each count the other's log output as evidence.
  concurrencyPolicy: Forbid
  # Bounded so a controller outage does not fire a backlog of hourly runs the
  # moment it recovers. One missed hour is nothing; twelve at once is an
  # incident the loop caused.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "kube-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: selfimprove
    spec:
      # No retries. A failed investigation is not worth re-running inside the
      # hour -- the next schedule is the retry, with an hour more evidence in
      # it. Retrying immediately would also re-read the same window and
      # re-report the same findings, inflating the counts the gate reads.
      backoffLimit: 0
      activeDeadlineSeconds: {{ $si.activeDeadlineSeconds | default 3600 }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "kube-agents.labels" . | nindent 12 }}
            app.kubernetes.io/component: selfimprove
            # The label the NetworkPolicy above selects. It is NOT
            # `kubeagents.x-k8s.io/has-credential-proxy`, and that omission is
            # load-bearing: that label is the ingress selector on the existing
            # github-token-minter's NetworkPolicy, so wearing it would let this
            # pod reach the minter that issues tokens for the user's GitOps
            # repositories. The loop gets its own minter or it gets none.
            kubeagents.x-k8s.io/selfimprove: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $si.github.ksaName | default $name }}
          {{- with (include "kube-agents.imagePullSecrets" .) }}
          {{- . | nindent 10 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          {{- if $needsForge }}
          # The credential proxy, as a native sidecar: an initContainer with
          # `restartPolicy: Always`. A plain container would never terminate,
          # and a Job whose pod has a container that never terminates never
          # completes -- so `concurrencyPolicy: Forbid` would block every
          # subsequent run forever. The native-sidecar form is what makes the
          # proxy usable inside a Job at all.
          #
          # Present only in fork and upstream mode. Under report-only there is
          # no credential path in this pod, which is what makes report-only
          # worth having as a distinct mode rather than a flag on the same
          # deployment.
          initContainers:
            - name: envoy-credential-proxy
              restartPolicy: Always
              image: {{ printf "%s:%s" (include "kube-agents.imageRepository" (dict "repository" (regexReplaceAll "/platform-agent$" .Values.platformAgent.deployment.image.repository "/credential-proxy") "root" $)) $agentTag }}
              imagePullPolicy: {{ .Values.platformAgent.deployment.image.pullPolicy }}
              command: ["/usr/local/bin/start-services"]
              env:
                - name: PLATFORM_AGENT_HOME
                  value: /tmp/credential-proxy
                - name: HOME
                  value: /tmp/credential-proxy/home
                - name: CREDENTIAL_PROXY_POLICY
                  value: /etc/credential-proxy/policy.json
                - name: CREDENTIAL_PROXY_STATE_DIR
                  value: /var/lib/credential-proxy
                - name: CREDENTIAL_PROXY_UNIX_SOCKET
                  value: /var/run/credential-proxy/backend.sock
                - name: CREDENTIAL_PROXY_WORKSPACE_ROOT
                  value: /home/selfimprove
                - name: KSA_TOKEN_FILE
                  value: /var/run/secrets/kubeagents/serviceaccount/token
                # The whole integration seam. One variable decides which minter
                # is called, so a second GitHub identity costs a second Service
                # and this line -- no change to credential_proxy.py, no change
                # to the existing minter, and nothing the agent's own path can
                # observe. See docs/designs/self-improvement.md sec. 6.
                - name: TOKEN_BROKER_URL
                  value: http://{{ $name }}-token-minter.{{ $ns }}.svc.cluster.local:8080/token
                # No event watcher here. It watches cluster API servers and
                # opens triage sessions, which is the outward-facing job this
                # pod must not do -- and it never terminates, so it would also
                # keep the Job from completing even as a sidecar.
                - name: EVENT_WATCHER_ENABLED
                  value: "false"
                # No cluster bootstrap. The agent's proxy runs `gcloud
                # container clusters get-credentials` at startup; this one must
                # not, because a kubeconfig for a managed cluster is exactly
                # the credential the loop is designed not to hold.
                - name: CREDENTIAL_PROXY_BOOTSTRAP_COMMAND
                  value: ""
              ports:
                - name: cred-proxy
                  containerPort: 8765
              readinessProbe:
                exec:
                  command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8765/healthz"]
                initialDelaySeconds: 5
                periodSeconds: 15
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: credential-proxy-policy
                  mountPath: /etc/credential-proxy/policy.json
                  subPath: policy.json
                  readOnly: true
                - name: credential-proxy-tmp
                  mountPath: /tmp
                - name: credential-proxy-state
                  mountPath: /var/lib/credential-proxy
                - name: credential-proxy-runtime
                  mountPath: /var/run/credential-proxy
                - name: credential-proxy-ksa-token
                  mountPath: /var/run/secrets/kubeagents/serviceaccount
                  readOnly: true
                - name: workspace
                  mountPath: /home/selfimprove
          {{- end }}
          containers:
            - name: runner
              # The agent image, and this is the one thing the loop genuinely
              # shares with the rest of the install. It has to: the runner's job
              # is to investigate the code that is running, and the only
              # trustworthy statement of which commit that is comes from the
              # image itself. A separate, smaller image would be cleaner in
              # every way except the one that matters -- it would have to be
              # told the revision, and something would eventually tell it wrong.
              image: {{ printf "%s:%s" $agentImage $agentTag }}
              imagePullPolicy: {{ .Values.platformAgent.deployment.image.pullPolicy }}
              command: ["/opt/hermes/.venv/bin/python3", "/opt/selfimprove/scripts/selfimprove_run.py"]
              env:
                - name: SELFIMPROVE_MODE
                  value: {{ $mode | quote }}
                - name: SELFIMPROVE_HOME
                  value: /home/selfimprove
                - name: SELFIMPROVE_SIGNALS
                  value: {{ join "," $si.signals | quote }}
                - name: SELFIMPROVE_LEDGER_CONFIGMAP
                  value: {{ $ledgerName | quote }}
                - name: SELFIMPROVE_AGENT_DEPLOYMENT
                  value: {{ $observed | quote }}
                - name: SELFIMPROVE_ALLOW_UNSTAMPED_IMAGE
                  value: {{ $si.allowUnstampedImage | default false | quote }}
                - name: SELFIMPROVE_UPSTREAM_REPO
                  value: {{ $si.github.upstreamRepo | default "gke-labs/kube-agents" | quote }}
                - name: SELFIMPROVE_FORK_REPO
                  value: {{ $si.github.forkRepo | quote }}
                - name: SELFIMPROVE_INVESTIGATE_TIMEOUT
                  value: {{ $si.investigateTimeoutSeconds | default 3000 | quote }}
                - name: SELFIMPROVE_FILE_TIMEOUT
                  value: {{ $si.fileTimeoutSeconds | default 900 | quote }}
                # The same number as activeDeadlineSeconds above, so the runner
                # can see the deadline it is being measured against and stop
                # before the kubelet stops it. The two per-turn timeouts are
                # configured independently and their defaults already oversubscribe
                # this one; the runner clamps rather than the chart doing
                # arithmetic over a finding count nothing knows at render time.
                - name: SELFIMPROVE_DEADLINE
                  value: {{ $si.activeDeadlineSeconds | default 3600 | quote }}
                # The gate, as JSON, so the runner reads one value rather than
                # reconstructing a nested structure from flattened variables.
                - name: SELFIMPROVE_GATE
                  value: {{ toJson $si.gate | quote }}
                - name: HERMES_HOME
                  value: /home/selfimprove
                # Overlays the model ConfigMap above onto the profile config
                # copied from /opt/selfimprove. Deliberately NOT /etc/hermes:
                # that is the agent's managed directory and carries its chat
                # credentials in .env.
                - name: HERMES_MANAGED_DIR
                  value: /etc/hermes-selfimprove
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: KUBE_DEFAULT_NAMESPACE
                  value: {{ $ns }}
                - name: GCP_PROJECT_ID
                  value: {{ $project | quote }}
                - name: GKE_PROJECT_ID
                  value: {{ $project | quote }}
                - name: GKE_CLUSTER_NAME
                  value: {{ .Values.platformAgent.harness.clusterName | quote }}
                - name: GKE_LOCATION
                  value: {{ .Values.platformAgent.harness.location | quote }}
                # PATH is set here because the image does not carry the proxy
                # shims on it -- the operator injects this same prefix as a
                # container env var (platformagent_manifests.go), so an agent
                # pod gets `git` and `gh` from the Deployment, not the
                # Dockerfile. A CronJob that inherited the image's PATH would
                # find no git at all, and in fork mode the filing turn would
                # fail with "command not found" after a full investigation had
                # already been paid for.
                #
                # The prefix is conditional, and that is the interesting half:
                # in report-only mode the shims stay OFF the path. The mode's
                # guarantee is that nothing leaves the cluster, and the cheapest
                # way to mean it is for the binaries that could not to be
                # unreachable -- rather than present, permitted, and relied on
                # not to be called.
                - name: PATH
                  value: {{ if $needsForge }}"/opt/credential-proxy/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"{{ else }}"/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"{{ end }}
                {{- if $needsForge }}
                - name: CREDENTIAL_PROXY_URL
                  value: http://127.0.0.1:8765
                {{- end }}
                # The runner's own logs go to stdout and therefore to Cloud
                # Logging, where the next run will read them. That is fine and
                # intended -- self-exclusion is applied at query time by
                # selfimprove_evidence.py, not by keeping the logs out of the
                # sink, because a loop whose own failures are invisible to it
                # cannot notice that it is broken.
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                {{- toYaml $si.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: workspace
                  mountPath: /home/selfimprove
                - name: managed-config
                  mountPath: /etc/hermes-selfimprove
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            # The run's whole world: the scaffolded Hermes profile, the source
            # checkout, the sessions, and findings.json. An emptyDir, so it dies
            # with the Job -- the property that makes the loop safe to leave on,
            # since a run cannot accumulate state that changes the next one.
            - name: workspace
              emptyDir:
                sizeLimit: {{ $si.workspaceSizeLimit | default "4Gi" }}
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: managed-config
              configMap:
                name: {{ $name }}-config
            {{- if $needsForge }}
            - name: credential-proxy-policy
              configMap:
                name: {{ $name }}-credential-proxy-policy
            - name: credential-proxy-tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: credential-proxy-state
              emptyDir:
                sizeLimit: 2Gi
            - name: credential-proxy-runtime
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
            - name: credential-proxy-ksa-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: kubeagents-credential-proxy
                      expirationSeconds: 3600
                      path: token
            {{- end }}
{{- if $needsForge }}
---
# The argv policy for the runner's proxy. `command_policy.py` governs kubectl
# and gcloud only, and both lists are empty here: this proxy exists to hold a
# GitHub token, and there is no cluster or project it is allowed to touch.
# git and gh are outside the policy's scope entirely (they are gated by the
# token the broker mints), which is why an empty file is a real restriction on
# this pod and not a vacuous one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-credential-proxy-policy
  namespace: {{ $ns }}
  labels:
    {{- include "kube-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: selfimprove
data:
  policy.json: |
    {
      "kubectl": {"allow": []},
      "gcloud": {"allow": []}
    }
{{- end }}
{{- end }}
