{{- /*
The status ConfigMap fleet-audit writes its run telemetry into. See
docs/designs/fleet-audit-collectors-and-status.md §4.5. Two properties this
template exists to guarantee:

1. The ConfigMap is chart-created and carries no `data` key, so the writer's
   RBAC (get/patch, below) never needs `create` — `resourceNames`-scoped RBAC
   is ignored on `create` in Kubernetes, so a writer that could create this
   object could create *any* ConfigMap of that name, which is a materially
   different (and unwanted) grant. `helm.sh/resource-policy: keep` means a
   `helm upgrade` never touches its `data` (Helm only reconciles fields it
   rendered, and this template renders none) and `helm uninstall` — or
   disabling the feature — never deletes accumulated history.

2. It is not referenced anywhere the operator or this chart hashes into the
   agent pod template. The operator's config-hash annotations restart the
   agent pod whenever an owned ConfigMap's content changes
   (platformagent_manifests.go's getConfigMapHash set); this object is meant
   to be written on every audit run, and if it were in that set the agent
   would restart itself on every write.

The name is a literal, not a `.Values` knob: the credential-proxy sidecar's
`_handle_fleet_audit_status` (agents/platform/scripts/credential_proxy.py)
matches it exactly, and `audit_report.py` defaults to the same string.
*/}}
{{- if .Values.platformAgent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-agents-fleet-audit-status
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
---
{{- /*
Authorizes the credential-proxy sidecar's own in-cluster ServiceAccount —
never the agent — to patch the ConfigMap above, and nothing else. The write
is issued by the sidecar process itself, from
`_handle_fleet_audit_status`, using the standard projected token this
container already carries for the k8s-event-watcher it also hosts
(`/var/run/secrets/kubernetes.io/serviceaccount`); it is not reachable
through the agent-facing `kubectl` shim or `command_policy.py`'s allowlist
at all, so this Role authorizes the pod's real Kubernetes identity (its
KSA) rather than the Workload-Identity GSA `kubectl`/`gcloud` calls run as.
That is what keeps this binding simple and unconditional: it needs no
Workload Identity configuration, because every pod has a KSA regardless of
whether GKE Workload Identity is set up for it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-agents-fleet-audit-status-writer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kube-agents-fleet-audit-status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-agents-fleet-audit-status-writer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- include "kube-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-agents-fleet-audit-status-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.platformAgent.security.serviceAccountName | quote }}
    namespace: {{ .Release.Namespace }}
{{- end }}
