"R-05.5-2":
  text: "Operationally: one hub Deployment running **one active replica plus a lease-elected warm standby** — **never** scaled beyond one active, because a second active replica splits ingress — holding the fleet's **single Slack app** and its **one** Socket Mode connection."
  checks: []
"R-05.5-3":
  text: "**Cross-cluster connectivity (spoke → hub):** spokes consume the hub's inference (C5), Minty (C6), router (C15), and the mesh parent endpoint (C-AM) **remotely**, over **VPC-internal endpoints** (internal LoadBalancer / private `Service` on the shared VPC — never public)."
