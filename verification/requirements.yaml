"R-05.6-5":
  text: '| **Chat turn latency** | p95 < 10 s for read/plan; **p95 < 20 s from message to "done + undo handle"** for a routine single-object mutation. All four deterministic modes — `/kage`, `@handle`, thread affinity, channel binding — add **no** inference; only the NL fallback adds one router call | Mutations are now synchronous, so they are inside the user-visible budget. Channel binding exists partly so the common case never pays for inference |'
  checks: []
"R-05.6-6":
  text: "| **Chat ingress** | Socket Mode connection established **< 10 s** from pod start; **reconnect after a dropped socket p95 < 5 s, p99 < 30 s** with jittered backoff; platform event → `InboundMessage` **p95 < 250 ms**; **no event lost across a reconnect**. Readiness probes **connection state**, not process liveness. **One active replica, always** — leader-election lease duration 15 s / renew 10 s, so **failover from a dead leader to the standby holding the connection completes p95 < 20 s**, and **zero windows with two live Socket Mode connections** is an invariant rather than a target. Ingress availability **≥ 99.5%** on `kubeagents/chat_ingress_connected`, measured and alerted **separately from broker availability** | One app token permits **one** connection (§1.8), so it is a single failure domain for the human entrypoint — it must heal fast and be loudly down when it does not. Keeping it out of the broker's availability number is deliberate: a chat outage is not an actuation outage, and merging them would hide both |"
  checks: []
"R-05.6-7":
