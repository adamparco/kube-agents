"R-05.1.6-11":
  text: "That emits `kubeagents/phantom_action` and pages, because a journal that overstates is as dangerous as one that understates — undo plans would be generated against a state that was never entered."
  checks: []
"R-05.1.6-12":
  text: "Its own liveness is an SLI input: if `C-JR` has not completed a cycle in **10 min**, `kubeagents/jr_stale` fires — a silent reconciler is indistinguishable from a clean fleet, which is exactly the failure mode a backstop must not have. `C-JR` being down does **not** block writes (it is off the action path entirely, by design — see §2); it degrades detection, and that degradation is visible."
  checks: []
"R-05.1.7-1":
  text: '**Why it must exist as a component.** [03](03-security-model.md) §8.1 states the residual risk plainly — a successful prompt injection can cause **any action the agent was already authorized to perform** — and then bounds it with five mitigations, one of which is "it trips anomaly alerting … an unusual action rate, class mix, or target set auto-pauses the agent". [08](08-agent-runtime-and-identity.md) §4 leans on the same sentence twice as a bound on standing actor credentials.'
  checks: []
"R-05.1.7-2":
  text: "On a trip it calls **`C-BR`**, which performs the actual pause by patching `spec.operations.paused: true` with `pauseReason: anomaly/<dimension>` — the same field a human uses, so `resume` is unchanged and there is no separate anomaly state to clear. `C-AD` never pauses directly, so there is exactly one code path that stops an agent."
  checks: []
"R-05.1.7-3":
  text: "| **Rate** | Executed actions per rolling 15 min, compared to the agent's own trailing 14-day distribution for that hour-of-week | `> max(baseline_p99 × 3, baseline_p50 + 20)` — the floor stops a near-idle agent tripping on its third action of the week |"
  checks: []
"R-05.1.7-4":
  text: "| **Risk-class mix** | Share of `elevated` + `gated` + `forbidden`-rejected in the last 50 actions, vs the trailing baseline share | Elevated-and-above share exceeding `baseline + 0.25` absolute, **or** ≥ 3 `forbidden` rejections in 15 min (which also auto-pauses via §1.5 independently) |"
  checks: []
"R-05.1.7-5":
  text: "| **Target-set novelty** | Fraction of the window's targets whose `(kind, name-prefix)` was never touched by this agent in the baseline | `> 0.5` of a window of ≥ 10 actions. Touching things it has never touched is the clearest injection tell, and the hardest to fake as legitimate |"
  checks: []
"R-05.1.7-6":
  text: "Thresholds are per-tier configuration with a code ceiling; they may be tightened by an operator, never loosened past the ceiling, and never by an agent."
  checks: []
"R-05.1.7-7":
  text: 'It **never** relaxes the class-mix or novelty dimensions, and it is itself a journaled, roster-only action, so "the attacker just opens a change window" requires already holding roster authority.'
  checks: []
"R-05.1.7-8":
  text: "That is the shape `C-AD` is looking for, and it is not a rate limiter's shape — a fleet rollout of 400 objects inside a single chain does not trip it, while 12 heterogeneous self-initiated actions against never-before-touched Secrets does."
  checks: []
"R-05.1.8-1":
  text: "**Shape.** One `Deployment` `kage-router` and one ClusterIP `Service` in the hub's `kubeagents-system` namespace (§3): **exactly one _active_ replica, with a lease-based leader election electing a warm standby** — not a normally-scaled Deployment, and never two active replicas."
  checks: []
"R-05.1.8-2":
  text: "| **Ingress** | Terminate the platform connection; decode the platform event; extract text, principal, channel, thread | **Yes** — one adapter per platform (Slack, Chat) |"
  checks: []
"R-05.1.8-3":
