"R-08.4-3":
  text: "| **Compromised controller** — it can bind an actor SA to a pod it creates, which is effectively use of that SA | The sharpest residual risk in this doc, and stated as such. Bounded by: the controller holds **no** RBAC/SA-write verb (it cannot create a _new_ authority, only re-use existing ones); its Deployment/Pod/Secret writes are confined to `kubeagents-system` and agent placement namespaces **by per-namespace `RoleBinding`, with nothing granted cluster-wide** (§2.7) — so it cannot create a pod in a namespace no bundle admitted it to, and cannot manufacture such a namespace; it holds **no read verb on `Secrets`**, so it cannot exfiltrate an agent token directly; the ownership+image pinning rule of [03](03-security-model.md) §4.3 rejects a pod that binds an actor SA without being transitively owned by that SA's `Agent` CR **and** running the broker image, so a smuggled pod is rejected at admission — label-matching alone would not have caught it, since the controller sets the labels; every resulting write is still scope-bounded, still needs an `action-id`, and `C-JR` journal reconciliation ([05](05-system-architecture.md) §1) flags fabricated ones ([01](01-vision-scope.md) §7 SLI 2). **Residual after all of that:** re-use of already-delegated actor identities, within their own scopes, for the duration of the compromise. Treat the controller as **in the trust boundary** and review its changes accordingly |"
  checks: []
"R-08.4-4":
  text: "| **Forged or replayed envelope** | mTLS + audience-bound `TokenReview`; scope derived from the authenticated caller, never the body; a broker accepts exactly one reader identity; NetworkPolicy admits only its own agent (§2.3) |"
  checks: []
"R-08.4-5":
  text: "| **Broker unavailable at a critical moment** | Agent degrades to observe-and-report and says so; work queue preserved; no direct-write fallback exists (§2.4). Availability targets and chaos coverage in [05](05-system-architecture.md) §6, §8 |"
  checks: []
"R-08.4-6":
  text: "| **Wrong-but-authorized action** (autonomy failure) | Not a runtime control — verify-then-rollback, initiative budgets, flap detection, `contested` markers ([04](04-workflow-model.md) §4.2, §5), undo and pause ([03](03-security-model.md) §6) |"
  checks: []
"R-08.4-7":
  text: "| **Confused deputy** — a trusted human drives the agent beyond their own rights | Accepted in v1, and a **larger** trade than in the read-only generation because it now exposes writes. Bounded by trusted-human access, the scope ceiling, and the gated class ([03](03-security-model.md) §4a); per-request down-scoping is the deferred fix (§5.2) |"
  checks: []
"R-08.4-8":
  text: "| **Cron self-triggered by a compromised pod** | Runs at reader authority; any change goes through the same broker, gates and journal — no privilege path |"
  checks: []
"R-08.5.1-1":
  text: "That capability is **deferred past v1** — v1 agents reason, decide, and submit Action Envelopes — but when it lands it must not run in the agent's own pod."
  checks: []
"R-08.5.1-2":
  text: "Code generated inside the sandbox that wants to change something must exit as **data**, become an envelope, and take the same brokered path as everything else."
  checks: []
"R-08.5.1-3":
  text: "**Known limit (pair, don't rely on it alone).** gVisor stops container escape and host-kernel exploits; it does **not** constrain what the code does within the permissions it is granted, and a documented metadata-server escape must be closed with `NetworkPolicy`."
  checks: []
"R-08.5.1-4":
  text: "The capability and its sandbox therefore ship **together**, as a unit, post-v1 — never code execution first, sandbox later."
  checks: []
"R-08.5.2-1":
  text: 'The inversion **promotes it to a v1 requirement** ([03](03-security-model.md) §4.2): a parent now holds real authority to create children, so "a parent cannot _express_ an over-grant" is no longer sufficient — it must be unable to _cause_ one.'
  checks: []
"R-08.5.2-2":
  text: "If pod cost ever forces consolidation, the only acceptable shape is **one broker process per actor identity**, however they are packed; the identity may not be shared."
