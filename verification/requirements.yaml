"R-05.5-4":
  text: "**OKF base (C9):** curated knowledge as markdown-in-git under the repo's **`knowledge/` root** — outside the paths any customer pipeline deploys, so it is never applied to a cluster."
  checks: []
"R-05.5.1-1":
  text: "Two consequences to enforce rather than assume: (a) the audit policy must capture `RequestResponse` at these principals **cluster-wide**, not under a namespace selector; and (b) because the filter is now a name pattern, the **name pattern is load-bearing** — `C-AS` already constrains agent SA names to the tier template ([03](03-security-model.md) §3.4), and that constraint is what stops an agent identity from existing outside the filter's reach."
  checks: []
"R-05.5.1-2":
  text: "| **1. Zero cross-scope escapes** | K8s audit log + Cloud Audit Logs, under the **SA name-pattern filter above** (`config/audit/audit-policy.yaml` must be corrected from its current namespace-scoped filter). Any request whose principal is an agent identity (reader **or** actor) and whose resource falls outside the scope registered for that identity, including `SubjectAccessReview` **allow** results. Metric `kubeagents/cross_scope_escape` | **0.** Any occurrence pages. Auto-pauses the agent |"
  checks: []
"R-05.5.1-3":
  text: "| **2. Zero unjournaled mutations** | Three detectors, of decreasing strength. (a) **Prevented at admission** — `C-AS` rejects any actor-identity `create`/`update`/`patch` lacking `kube-agents/action-id`, so the failure mode is a denial, not a silent write. (b) **Detected by `C-JR`** (§1.6) — the join of audit-log writes against exported `ActionRecord`s on **`(action-id, target GVKNN)`**, which is the _only_ coverage for **deletes**, **cloud writes**, and **fabricated or reused ids**. (c) **Reader-identity writes** — any write at all by a reader identity, from the same join. Metrics `kubeagents/unjournaled_mutation`, `/action_id_fabricated`, `/action_id_reused`, `/phantom_action` | **0.** Any occurrence pages and auto-pauses. Detection within `C-JR`'s SLO (5 min p95 K8s / 15 min p95 cloud), **not** instantaneously — see §6 |"
  checks: []
"R-05.5.1-4":
  text: "| **3. Zero self-escalations** | Audit-log filter, again under the **SA name-pattern filter above**, for any agent-identity request that creates/modifies `Role`/`ClusterRole`/`*Binding`/IAM policy/Workload-Identity binding **naming an agent identity**, uses `escalate`/`bind`/`impersonate`, or touches an `Agent` CR, a VAP, the controller, a broker, or an `ActionRecord`. Excludes the attenuation-checked child-provisioning path (F4). Metric `kubeagents/self_escalation_attempt` | **0** executed; attempts are counted and page on repetition |"
  checks: []
"R-05.5.1-5":
  text: "| **4. Undo health** | Journal exporter gauges over a **rolling 7-day window**: `kubeagents/undo_plan_coverage` = executed non-gated records with `status.undoPlan.valid` ÷ all executed non-gated records; `kubeagents/undo_success_rate` = successful undos ÷ attempted undos. The denominator of the second is guaranteed by a **synthetic undo canary** — a scheduled routine action in a canary namespace, immediately undone and diffed, **hourly per cluster**, so the window always contains **≥ 150 undo attempts** and the ratio is never computed over a near-empty set | Coverage **= 1.0**. Success rate **≥ 0.999 over ≥ 150 attempts / 7 d**, and **any single canary failure pages** regardless of the ratio. A window with < 150 attempts is reported `insufficient-data` and pages on the canary, never silently as 1.0 |"
  checks: []
"R-05.5.1-6":
  text: "**4** is produced by the journal exporter plus the canary. `C-AD` (§1.7) feeds none of the four directly; it is a control, not an SLI, and its own health (`kubeagents/ad_stale`) and `C-JR`'s (`kubeagents/jr_stale`) are **meta-SLIs** that must be on the same dashboard — a green board produced by a dead watchdog is the specific failure this set is arranged to make impossible."
  checks: []
"R-05.6-1":
  text: "| Fleet scale | ≥ 50 spoke clusters per hub | Fleet-governance use case |"
