  checks: []
"R-05.6-8":
  text: "| **Time to remediate (F6)** | Detection → verified fix, p50 < 2 min for routine namespace-scope issues; p95 < 15 min including diagnosis | The product claim, measured |"
  checks: []
"R-05.6-9":
  text: "| **Undo latency** | `undo` → restored + verified: **p95 < 30 s** (K8s targets), < 5 min (cloud). Add ≤ 20 s when the target broker must be woken from `scaleToZero` | The brake has to feel instant or it is not a brake |"
  checks: []
"R-05.6-10":
  text: "| **Brake propagation** | `pause` → broker refuses new envelopes **< 2 s p99**; in-flight action completes or rolls back < 30 s; local `FleetFreeze` apply → effective < 2 s; **fleet-wide freeze fan-out to the last spoke < 30 s**; all of it with inference down | [03](03-security-model.md) §6 requires the brake to work unconditionally |"
  checks: []
"R-05.6-11":
  text: '| **Journal durability** | **Two claims, not one.** **(a) Kubernetes `create`/`update`/`patch`: 100%, _enforced_** — `C-AS` rejects an unannotated actor write and the broker fails closed, so the failure mode is a denial. **(b) Kubernetes `delete`, subresource writes, and all cloud writes: _reconciled within an SLO_, not enforced** — a `DELETE` admission request carries no object to annotate and cloud APIs run no Kubernetes admission, so coverage is `C-JR`''s detection SLO (§1.6): unmatched K8s mutation reported ≤ 5 min p95 / 15 min p99, unmatched cloud mutation ≤ 15 min p95 / 30 min p99, with **0** unmatched mutations tolerated at steady state. Export to the audit sink < 60 s. Record TTL 30/90/365 d by class (+365 d for `Rejected`); guaranteed undo window 7/30/90 d; sink retention ≥ 400 days | SLI 2 is an invariant where it can be enforced and a bounded-latency detection where it cannot. Claiming "enforced, not measured" flatly would be false for exactly the two riskiest write classes |'
  checks: []
"R-05.6-12":
  text: '| **Blast-radius caps** | Per action, on the **post-expansion** object set (§1.1): **> 50 objects ⇒ `gated`**; **> 100 objects or `fractionOfScope` > 0.5 ⇒ hard abort**; an envelope carries ≤ 50 literal operations. Plus the tier caps: ≤ 1 namespace for the dev-team tier, ≤ 1 node pool for the cluster tier. `fractionOfScope`''s denominator is **workload objects in the agent''s scope** (§1.1) | Bounds "correct remediation applied at machine speed" ([03](03-security-model.md) §1 class C) |'
  checks: []
"R-05.6-13":
  text: "| **Initiative budget** | **Per class**, per agent, per rolling hour: default ≤ 50 `routine` **+** ≤ 10 `elevated`. Carried by **per-class fields on the `Agent` CRD** ([06](06-api-and-data-contracts.md) §1.1) — a single class-agnostic counter cannot express it. Human-requested actions draw on a separate, larger allowance. Flap cooldown per target. Exhaustion **refuses and escalates; it does not pause** (§1.5, [04](04-workflow-model.md) §4.2) | Relentless, not thrashing — and a budget that pauses the agent turns a rate bound into an outage |"
  checks: []
"R-05.6-14":
  text: "| **Availability** | **Broker ≥ 99.9% per scope**, measured as successful-response minutes ÷ eligible minutes over a **rolling 28-day window per broker**, probed by a **1/min synthetic no-op envelope** from the agent pod (a `dryRun`-only classify-and-reject envelope against a canary object, which exercises auth, informers, classification, and the journal read path without writing). **Unavailable** = a probe that times out (> 10 s), returns 5xx, or fails TLS/`TokenReview`. **Not** unavailable, and excluded from the denominator: `403 agent-paused` / `403 fleet-frozen` / `403 target-contested` (the brake working is not an outage) and `429` (backpressure is a designed response). A window with < 90% probe coverage is `insufficient-data`, not `available`. **Spoke brokers execute with the hub down**; agent _reasoning_ pauses (hub-hosted inference). Controller down ⇒ running agents and brokers keep working, no new reconciles | No cascade; the hub is a reasoning dependency, not an acting one. Excluding the brake responses matters: a frozen fleet would otherwise read as a fleet-wide outage and train operators to distrust the metric |"
  checks: []
"R-05.6-15":
  text: '| **Recovery** | **Agent pod restart → Ready: p95 < 10 s, p99 < 30 s** from container start (PVC-backed state; the p99 covers PVC reattach). **Broker restart → serving: p95 < 5 s, p99 < 15 s**, then reconcile every non-terminal `ActionRecord` it owns within a further **30 s p95** — complete or roll back, never leave half-applied. Measured from the kubelet''s container-start timestamp to the first successful readiness probe on `:8081/readyz` (§1.1) | The write-ahead journal is what makes restart safe (§1.1). "A few s" is not a target — a percentile and a probe are |'
  checks: []
