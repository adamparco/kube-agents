  checks: []
"R-05.1.8-13":
  text: "**Scaling out is not the fix and must not be attempted:** a second active replica either has its connection refused or splits ingress, and `maxConnections: 1` is a code constant precisely so no operator can turn a capacity dial into a correctness bug."
  checks: []
"R-05.1.8-14":
  text: "The mitigations are therefore **lease-based leader election with a warm standby and fast failover**, a liveness probe on **connection state** rather than on process health (a router holding the lease with a dead socket is _not_ healthy and must lose the lease), and the `kubectl` and API paths that make every operational command reachable without chat at all."
