"R-05.1-23":
  text: "| C15 | **ChatOps gateway & router** | **The fleet's single human entrypoint, Slack-first.** Holds the **one** Slack app for the whole fleet and its **single** Socket Mode connection, normalizes each event into one internal message, enforces the target agent's `allowedUsers` **before** dispatch, and routes to the addressed agent over the per-agent transport — `/kage` verb, `@kage <handle>`, thread affinity, channel binding, NL inference last ([02](02-agent-personas.md) §2.4, [06](06-api-and-data-contracts.md) §2b). Google Chat is the fully supported opt-in second ingress, on the **same** normalizer and the **same** dispatch. Also delivers **gate prompts** (Block Kit) and **action reports** back to the humans ([04](04-workflow-model.md) §3). Configured by the cluster-scoped **`ChatOpsConfig`** singleton `default`; runs as **one active replica with a lease-elected standby** — never two. **Credential-bearing:** the Slack app and bot tokens live here and nowhere else (§1.8) | `k8s-operator/cmd/router/` + `internal/router/`; Slack **Socket Mode** (outbound WebSocket, no public ingress) + optional Chat Pub/Sub pull; keyed on `internal/agentindex` | Exists (extend — Slack ingress) |"
