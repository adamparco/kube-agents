"R-05.4-1":
  text: "The model's output is a **proposal to the broker**, never an API call: the agent pod has no write credential."
  checks: []
"R-05.4-2":
  text: "Failure here is reported and retried; it **never** rolls back or delays the action."
  checks: []
"R-05.4-3":
  text: "_(Asynchronous, off the critical path, always on.)_ Within the next cycle **`C-JR`** (§1.6) joins step 8's audit-log entries against step 10's record on `(action-id, target GVKNN)` and confirms the two sides agree, and **`C-AD`** (§1.7) folds the record into the agent's action stream."
  checks: []
"R-05.4-4":
  text: "Both are watchdogs, not gates: neither can delay or block an action, and neither being down stops step 8 — what stops is the _detection_ of a step that skipped the rest of the flow. `C-JR` is the only observer of steps that never reached step 3 at all (a delete, a cloud call), which is why it exists."
  checks: []
"R-05.4-5":
  text: "A Platform Agent rolling out a policy resolves its children from their `Agent` CRs (§1.4) and sends each a **delegation** carrying intent, a chain ID, and a depth counter — never an envelope and never a credential."
  checks: []
"R-05.4-6":
  text: "The callee authenticates the caller by mTLS + `TokenReview`, derives the caller's `(tier, scope)` from that identity, and checks the structural rule (delegation must target a strict subset of the caller's scope; escalation must go to the declared `parentRef`)."
  checks: []
"R-05.4-7":
  text: "The parent never hand-authors RBAC."
  checks: []
"R-05.4-8":
  text: "**Normalize.** C15 decodes the platform event into **one internal message**: the text, the **platform-qualified principal** (`slack:U0123ABCD`; `googlechat:users/123` on Chat — never a display name or email), the channel, and a platform-qualified **`threadKey`** derived from Slack's `thread_ts`."
  checks: []
"R-05.4-9":
  text: "Routing is a convenience, **never** an authz signal: a mis-route lands only on an agent the human may already reach, still bounded by that agent's scope ceiling and gates."
  checks: []
"R-05.4-10":
  text: "Expiry is the safe default; an expired action must be re-proposed, not resurrected."
  checks: []
"R-05.5-1":
  text: "Inference is on the **reasoning** path only — never on the write path, and never consulted for a trust decision ([03](03-security-model.md) §9)."
