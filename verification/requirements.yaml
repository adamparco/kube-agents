  checks: []
"R-05.1-3":
  text: "| **C-JS** | **Journal store** | Durable home of `ActionRecord`s — pre-state snapshot, applied diff, verification result, undo plan, attribution. **Decision: `ActionRecord` custom resources** in the agent's own namespace, continuously exported to the audit sink. Survives the agent and broker pods (§1.2) | `ActionRecord` CRD (`kubeagents.x-k8s.io/v1alpha1`) + exporter in the controller → Cloud Logging / object sink | New (v1, load-bearing) |"
  checks: []
"R-05.1-4":
  text: "| **C-JR** | **Journal reconciler** | The **completeness backstop** behind `C-JS`. Continuously joins the Kubernetes and Cloud audit logs against exported `ActionRecord`s to find writes with no record, fabricated or **reused** `action-id`s, and cloud mutations — which no admission controller sees. The only enforcement available for **deletes** and for cloud calls, where the `action-id` annotation cannot be required at admission ([03](03-security-model.md) §4.3). Produces SLI 2 (§5.1, §1.6) | Controller-hosted reconciler in `k8s-operator/` (log-sink reader + journal watch), one per cluster + one hub-side for cloud logs | New (v1, load-bearing) |"
  checks: []
"R-05.1-5":
  text: "| **C-AD** | **Anomaly detector** | Watches each agent's own action stream (rate, risk-class mix, target-set novelty) against a per-agent learned baseline and **auto-pauses** the agent on a trip, via `C-BR`. This is the bound that [03](03-security-model.md) §6/§8.1 and [08](08-agent-runtime-and-identity.md) §4 place on an injected-but-in-scope agent and on standing actor credentials (§1.7) | Controller-hosted detector in `k8s-operator/` over the `ActionRecord` watch; no LLM, no external ML service | New (v1, load-bearing) |"
  checks: []
"R-05.1-6":
  text: "| **C-UC** | **Undo controller** | Executes `undo <action-id>` by replaying a recorded undo plan **through the target agent's broker** — including when the originating agent is paused, scaled to zero, or deleted. Watches `UndoRequest` objects and chat/`kubectl` invocations; reports restoration against the recorded snapshot (§1.3) | Controller in `k8s-operator/` (reconciles `UndoRequest` → broker call) | New (v1, load-bearing) |"
  checks: []
"R-05.1-7":
  text: "| **C-AM** | **Agent mesh** | The direct agent-to-agent call path: **delegation** (parent → child) and **escalation** (child → parent). Replaces the read-only generation's indirect coordination through the repo. mTLS + `TokenReview`; the callee **re-authorizes in its own scope** and never inherits the caller's authority (§1.4) | **HTTPS+JSON** on the **agent** pod at `<agent>.<ns>.svc:8444/v1alpha1/mesh/{delegate,escalate}`, terminating on the existing in-pod session-inject seam (`kind: delegation` / `escalation`) | New (v1) |"
  checks: []
"R-05.1-8":
  text: "| **C-BR** | **Brake surface** | `pause` (`spec.operations.paused` on the `Agent` CR), `freeze` (cluster-scoped `FleetFreeze`), `contested` markers, and their propagation to every broker. Must remain effective with inference, the router, and the hub all unavailable (§1.5) | CRD fields + `FleetFreeze` CRD + broker informers + controller fan-out | New (v1, load-bearing) |"
  checks: []
"R-05.1-9":
  text: "| **C-AS** | **Admission backstop** | The independent, out-of-broker enforcement of [03](03-security-model.md) §4.3: `vap-agent-scope` (in-tree CEL VAP — reader SAs write nothing, actor SAs write only their tier template within scope, no RBAC naming an agent identity, no control-plane/journal tampering, **every actor write must carry `kube-agents/action-id`**) plus the controller's validating webhook (cardinality, placement, **child ⊆ parent ceiling — v1**) | `ValidatingAdmissionPolicy` (K8s ≥1.30) + `k8s-operator/internal/webhook/` + cert-manager | Exists (invert + extend) |"
  checks: []
