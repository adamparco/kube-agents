  checks: []
"R-05.1.8-7":
  text: "Dispatch does not know, and must never learn, which platform a message arrived on."
  checks: []
"R-05.1.8-8":
  text: "**Principals are platform-qualified and immutable** — `slack:U0123ABCD`, `googlechat:users/123` — never a display name and never an email, both of which a user can change and an attacker can spoof. `allowedUsers` and the approval roster are written in the same form ([03](03-security-model.md) §4a)."
  checks: []
"R-05.1.8-9":
  text: "**Approvals.** A gate prompt (F8 step 3) renders as **Block Kit buttons over the same Socket Mode connection**, with a typed `/kage approve <action-id>` fallback that is always available."
  checks: []
"R-05.1.8-10":
  text: "The button is a **convenience, never an authorization**: the click delivers an `action-id` and a claimed principal, and the **broker re-verifies the clicking user against the approval roster** before releasing anything (F8 step 4)."
  checks: []
"R-05.1.8-11":
  text: "**The brake never depends on Slack.** `pause`, `freeze`, and `undo` are Kubernetes objects reachable by `kubectl` and by the API (§1.5, [06](06-api-and-data-contracts.md) §2b.1)."
