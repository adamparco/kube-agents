"R-05.1-22":
  text: "| C14 | **Authorization gateway** _(deferred — hardening)_ | User-scoped authorization (`SubjectAccessReview` + `testIamPermissions`) down-scoping each action to **agent scope ∩ requester permissions** ([03](03-security-model.md) §4a). **Not in v1.** When adopted it lands **inside C-AB**, which already authenticates the caller and resolves scope per action — it is no longer a separate gateway | Broker-hosted check (was: standalone gateway) | Deferred (relocated into C-AB) |"
