"R-05.6-3":
  text: "| **Action latency (K8s)** | Envelope → executed → journaled: **p95 < 5 s, p99 < 15 s** for a single-object routine write (classification + snapshot + SSA + verify + record) | The action is inside a chat turn now, not behind a merge |"
