# Implementation registry — V-MET-001.
#
# Check ID -> the command that asserts it, and the file that holds the assertion. 09 §6 says what
# each check asserts; `verification/results.csv` says what a run of it produced. Neither says WHERE
# the assertion lives, and until this file existed nothing did.
#
# WHY THAT GAP WAS EXPENSIVE. `dev/tests/phase-ratchet-is-asserted.py` prints a `hint: named by ...`
# column built from `git grep <check-id>`, under a footer that disclaims it: "The `hint` column is
# UNWEIGHTED and no property reads it. A file naming a check ID may be disclaiming it." On
# 2026-07-31 that column was read as coverage anyway, and a task was scheduled promising "eleven
# runs to record and two builds". The tree held one run and twelve builds. Nine of the eleven were
# "named by" a parser fixture, by `.claude/harness/binding.md` and the skills that REQUIRE the
# check, or by VAP corpora that are real, correct, and executed by nothing on either chain. A grep
# cannot tell an assertion from a citation. A human can, once, and write the answer down here.
#
# IT IS CURATED, NOT GENERATED, for the same reason `traceability.yaml` is. Every row below was
# decided by reading the named file against the 09 §6 assertion. A row produced by text similarity
# would assert an implementation nobody established -- V-MET-014 with extra steps.
#
# WHAT A ROW MEANS. `runs` is a command that appears VERBATIM on `dev/L0-CHAIN.txt` or
# `dev/L2-CHAIN.txt`, or is `make -C k8s-operator test` (the Go entry point `.claude/harness/
# binding.md` §Build names, which no chain line carries because it needs envtest), or is
# `python3 -m unittest discover dev`. An implementation nothing runs is not an implementation, and
# that is the second half of the lesson above: the VAP corpora were correct and unreachable.
# `asserts_in` is the file holding the assertion, and it must NAME the check ID -- so a later grep
# tells the truth, and so the two halves of this row cannot drift apart silently.
#
# `unimplemented:` IS A FINDING, NOT A WAIVER. It records a check with a green results row whose
# evidence attests to something other than the check`s stated property. The lint pins their count
# and refuses a rise (`UNIMPLEMENTED_CEILING` in dev/tests/check-ids-have-implementations.py), the
# same two-tier shape 09 §8.1 uses for coverage: a gate that always fails is a gate someone
# disables, so the gap is published and ratcheted rather than tolerated or hidden.
#
# WHAT IS NOT HERE. A check with no green row is absent, and that is correct: it is not in the
# implemented suite and `dev/tests/phase-ratchet-is-asserted.py` already owns the "required but not
# green" population. Do not add a row for work you intend to do.
#
# Schema (see `load_registry` in dev/tests/check-ids-have-implementations.py -- strict, no PyYAML,
# because L0 installs no dependencies): one top-level quoted check ID per entry, holding EITHER
# `runs:` + `asserts_in:` (both JSON-encoded scalars) OR `unimplemented:` (one JSON-encoded scalar).
# Anything else is a parse error, not a reinterpretation.

