  - id: gat-145
    description: an object marked forbidden is refused
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        override: forbidden
    expect:
      class: forbidden
      rules:
        - object-override

  - id: gat-146
    description: an object with no override annotation does not fire the rule
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - object-override

  # ---------------------------------------------------------------------------------------------
  # N. out-of-scope (step 1). Forbidden, and it SHORT-CIRCUITS: no other rule is consulted, because
  #    reasons about the merits of the action would invite an approver to weigh something they
  #    should simply refuse.
  # ---------------------------------------------------------------------------------------------
  - id: gat-150
    description: a namespace-scoped agent reaching into another namespace is forbidden
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-b
        name: web
    expect:
      class: forbidden
      rules:
        - out-of-scope

  - id: gat-151
    description: >-
      a namespace-scoped agent reaching at CLUSTER scope is forbidden. This case found a scope
      escape: ScopeOfTarget used to leave the caller's own namespace on a target that has none, so
      every cluster-scoped object in the cluster resolved to the caller's own scope and passed
      step 1. See the function's comment.
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
    expect:
      class: forbidden
      rules:
        - out-of-scope

  - id: gat-152
    description: out-of-scope short-circuits even when the action would otherwise be routine
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        kind: ConfigMap
        namespace: team-b
        name: app-config
    expect:
      class: forbidden
      rules:
        - out-of-scope
      notRules:
        - default-routine

  - id: gat-153
    description: out-of-scope beats a gated rule and reports only itself
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-b
        name: data
    expect:
      class: forbidden
      rules:
        - out-of-scope
      notRules:
        - destructive-stateful-delete

  - id: gat-154
    description: >-
      a cluster admin for a DIFFERENT cluster is in scope for its own cluster's namespaces. There is
      no cross-cluster case to write here: a broker serves exactly one cluster, so a target's project
      and cluster are the caller's by construction (see ScopeOfTarget) and reaching into another
      cluster is not something an envelope can express -- it is refused a layer earlier, by there
      being no connection to that cluster at all.
    caller:
      name: cluster-admin-2
      tier: cluster-admin
      project: proj
      cluster: cluster-2
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - out-of-scope

  - id: gat-155
    description: an agent operating inside its own scope is not out of scope
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - out-of-scope

  - id: gat-156
    description: a cluster admin operating in any namespace of its cluster is in scope
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-z
        name: web
    expect:
      class: routine
      notRules:
        - out-of-scope

  - id: gat-157
    description: a cluster admin operating on a cluster-scoped object of its own cluster is in scope
    ops:
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: ClusterRole
        name: app-reader
        direction: tighten
    expect:
      class: routine
      notRules:
        - out-of-scope

  - id: gat-158
    description: a platform agent operating in a namespace of its project is in scope
    caller:
      name: platform-1
      tier: platform
      project: proj
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - out-of-scope

  # ---------------------------------------------------------------------------------------------
  # O. The forbidden set (step 2). Not "very dangerous" -- dangerous things gate. Forbidden is for
  #    actions where a human's approval would not make the action safe, because the action destroys
  #    the ability to review, undo or audit it.
  # ---------------------------------------------------------------------------------------------
  - id: gat-160
    description: deleting an ActionRecord is forbidden -- it is the journal this action lands in
    ops:
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-161
    description: patching an ActionRecord is forbidden
    ops:
      - verb: patch
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-162
    description: editing a ChangePolicy is forbidden -- it decides which actions need approval
    ops:
      - verb: apply
        group: kubeagents.gke-labs.dev
        kind: ChangePolicy
        name: tenant-floor
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-163
    description: deleting a FleetFreeze is forbidden -- it is the brake
    ops:
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: FleetFreeze
        name: global
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-164
    description: editing an ApprovalRoster is forbidden -- it lists the humans who may approve
    ops:
      - verb: patch
        group: kubeagents.gke-labs.dev
        kind: ApprovalRoster
        name: oncall
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-165
    description: creating an Agent is forbidden -- it is how an agent would widen its own scope
    ops:
      - verb: create
        group: kubeagents.gke-labs.dev
        kind: Agent
        namespace: kube-agents-system
        name: new-agent
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-166
    description: disabling the kube-agents admission webhook is forbidden
    ops:
      - verb: delete
        group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: kube-agents-validating-webhook
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-167
    description: a DIFFERENT webhook config is not in the forbidden set -- the entry is name-scoped
    ops:
      - verb: delete
        group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: some-other-webhook
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen
      notRules:
        - forbidden-set

  - id: gat-168
    description: changing the audit policy is forbidden
    ops:
      - verb: patch
        group: apiserver.config.k8s.io
        kind: AuditPolicy
        name: default
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-169
    description: redirecting the audit log sink is forbidden
    ops:
      - verb: cloud
        group: logging.cnrm.cloud.google.com
        kind: LoggingLogSink
        namespace: kube-agents-system
        name: audit
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-170
    description: adding a log exclusion is forbidden -- it is a redirect wearing a filter
    ops:
      - verb: create
        group: logging.cnrm.cloud.google.com
        kind: LoggingLogExclusion
        namespace: kube-agents-system
        name: quiet
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-171
    description: deleting kube-system is forbidden
    ops:
      - verb: delete
        kind: Namespace
        name: kube-system
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-172
    description: deleting kube-agents-system is forbidden
    ops:
      - verb: delete
        kind: Namespace
        name: kube-agents-system
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-173
    description: deleting a TENANT namespace is merely gated -- a human can meaningfully say yes
    ops:
      - verb: delete
        kind: Namespace
        name: team-a
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
      notRules:
        - forbidden-set

  - id: gat-174
    description: CREATING an ActionRecord is not in the set -- the broker writes the journal
    ops:
      - verb: create
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-2
    expect:
      class: routine
      notRules:
        - forbidden-set

  # ---------------------------------------------------------------------------------------------
  # P. no-undo-plan (step 6). At least gated: an action that cannot be rolled back has no remedy but
  #    a human noticing in time, which is what a gate is for.
  # ---------------------------------------------------------------------------------------------
  - id: gat-180
    description: a routine action with no undo plan gates
    undoPlan: false
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: gated
      rules:
        - no-undo-plan

  - id: gat-181
    description: an elevated action with no undo plan gates
    undoPlan: false
    ops:
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
    expect:
      class: gated
      rules:
        - no-undo-plan
        - secret-write

  - id: gat-182
    description: a DRY RUN with no undo plan does not gate -- there is nothing to undo
    undoPlan: false
    dryRun: true
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - no-undo-plan

  - id: gat-183
    description: no-undo-plan does not lower an already-forbidden action
    undoPlan: false
    ops:
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
    expect:
      class: forbidden
      rules:
        - forbidden-set
      notRules:
        - no-undo-plan

  - id: gat-184
    description: an action WITH an undo plan does not fire the rule
    undoPlan: true
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - no-undo-plan

  # ---------------------------------------------------------------------------------------------
  # Q. The caller's own knobs. Both raise only, which is why they are safe to accept from an
  #    envelope at all.
  # ---------------------------------------------------------------------------------------------
  - id: gat-190
    description: an agent voluntarily asking for approval gets it
    requireApproval: true
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: gated
      rules:
        - caller-requested-approval

  - id: gat-191
    description: requireApproval cannot lower a forbidden action
    requireApproval: true
    ops:
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
    expect:
      class: forbidden
      notRules:
        - caller-requested-approval

  - id: gat-192
    description: a dry run of a forbidden action is still forbidden
    dryRun: true
    ops:
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-193
    description: a dry run of a gated action is still gated -- classification is not execution
    dryRun: true
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-194
    description: a declared maxObjects does not by itself change the class
    maxObjects: 10
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine

  # ---------------------------------------------------------------------------------------------
  # R. Multi-operation envelopes. ONE classification for N operations, taking the max: 06 §5
  #    executes an envelope as a unit and undoes it as a unit, so classifying operations
  #    independently would tear the transaction in half.
  # ---------------------------------------------------------------------------------------------
  - id: gat-200
    description: an envelope of routine operations is routine
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: api
      - verb: apply
        kind: ConfigMap
        namespace: team-a
        name: app-config
    expect:
      class: routine

  - id: gat-201
    description: one elevated operation makes the envelope elevated
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
    expect:
      class: elevated
      rules:
        - secret-write

  - id: gat-202
    description: one gated operation makes the whole envelope gated
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
        - secret-write

  - id: gat-203
    description: one forbidden operation forbids the whole envelope
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
    expect:
      class: forbidden
      rules:
        - forbidden-set

  - id: gat-204
    description: an abort in any operation aborts the envelope
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 150
    expect:
      abort: true
      rules:
        - blast-radius-hard-cap

  - id: gat-205
    description: an out-of-scope operation forbids the envelope even if the rest is in scope
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-b
        name: web
    expect:
      class: forbidden
      rules:
        - out-of-scope

  - id: gat-206
    description: an envelope of fifty routine operations is still routine
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: a
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: b
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: c
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: d
    expect:
      class: routine

  # ---------------------------------------------------------------------------------------------
  # S. Combinations. The reason a corpus exists rather than only per-rule tests: these are the cases
  #    where several inputs interact and where an implementation that is right about each rule
  #    individually can still be wrong.
  # ---------------------------------------------------------------------------------------------
  - id: gat-210
    description: production PVC delete by a novel agent against a routine-marked object still gates
    seen: false
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
        override: routine
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-211
    description: a cross-tier write into production stays gated, not forbidden
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        lowerTierOwner: dev-team-a
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - cross-tier-direct-operation
        - production-environment

  - id: gat-212
    description: secret egress into production gates and names both inputs
    ops:
      - verb: apply
        kind: ConfigMap
        namespace: team-a
        name: app-config
        namespaceLabels:
          env: production
        secretMaterial:
          - namespace: team-a
            secret: db-creds
            key: password
            where: /data/DB
            form: raw
    expect:
      class: gated
      rules:
        - secret-material-egress
        - production-environment

  - id: gat-213
    description: a large production rollout gates on blast radius rather than aborting
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 60
        fraction: 0.2
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      abort: false
      rules:
        - blast-radius-cap
        - production-environment

  - id: gat-214
    description: an out-of-scope operation beats an abort -- scope is step 1 and short-circuits
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-b
        objects: 500
    expect:
      class: forbidden
      abort: false
      rules:
        - out-of-scope
      notRules:
        - blast-radius-hard-cap

  - id: gat-215
    description: a forbidden-set operation beats an abort in the same envelope
    ops:
      - verb: delete
        group: kubeagents.gke-labs.dev
        kind: ActionRecord
        namespace: kube-agents-system
        name: ar-1
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 500
    expect:
      class: forbidden
      abort: false
      rules:
        - forbidden-set

  - id: gat-216
    description: identity change plus production plus novel is gated, never forbidden
    seen: false
    ops:
      - verb: create
        kind: ServiceAccount
        namespace: team-a
        name: app
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-217
    description: a tightening security change in production is elevated, not gated
    ops:
      - verb: create
        group: networking.k8s.io
        kind: NetworkPolicy
        namespace: team-a
        name: default-deny
        direction: tighten
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: elevated
      rules:
        - production-environment
      notRules:
        - security-loosen

  - id: gat-218
    description: no undo plan on an out-of-scope action does not soften it to gated
    undoPlan: false
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-b
        name: web
    expect:
      class: forbidden
      rules:
        - out-of-scope

  - id: gat-219
    description: an object override cannot rescue an out-of-scope action
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-b
        name: web
        override: routine
    expect:
      class: forbidden
      rules:
        - out-of-scope

  - id: gat-220
    description: traffic shift plus production plus cross-tier is gated and names all three
    ops:
      - verb: patch
        kind: Service
        namespace: team-a
        name: web
        lowerTierOwner: dev-team-a
        touchedPaths:
          - /spec/selector
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - traffic-shift-production
        - cross-tier-direct-operation
        - production-environment

  - id: gat-221
    description: an envelope mixing a tightening and a loosening operation gates
    ops:
      - verb: create
        group: networking.k8s.io
        kind: NetworkPolicy
        namespace: team-a
        name: deny
        direction: tighten
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: ClusterRole
        name: app
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-222
    description: deleting a ConfigMap in production gates on the delete, capped at gated
    ops:
      - verb: delete
        kind: ConfigMap
        namespace: team-a
        name: app-config
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
        - production-environment

  - id: gat-223
    description: a dev-team agent's own secret write is elevated, not cross-tier
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
    expect:
      class: elevated
      rules:
        - secret-write
      notRules:
        - cross-tier-direct-operation

  - id: gat-224
    description: an abort beats a gate -- there is no approval button for a hard cap
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        objects: 200
    expect:
      abort: true
      rules:
        - blast-radius-hard-cap

  - id: gat-225
    description: a novel, no-undo-plan, production secret write is gated and not forbidden
    seen: false
    undoPlan: false
    ops:
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - secret-write
        - production-environment
        - novel-action

  - id: gat-226
    description: >-
      the whole ladder at once on an action that is otherwise routine. Two escalations, a
      blast-radius gate under the threshold, and an override that agrees with the outcome -- the
      answer is gated, from the override, and the escalations do not push it past.
    seen: false
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        objects: 20
        override: gated
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - object-override
      notRules:
        - blast-radius-cap
