    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        override: elevated
    expect:
      class: elevated
      rules:
        - object-override

  - id: gat-142
    description: an object marked routine does NOT lower a gated action
    ops:
      - verb: delete
