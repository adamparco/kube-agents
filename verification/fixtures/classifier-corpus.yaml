# The risk-classification corpus of docs/design/09-verification-and-validation.md §7.1.
#
# Each case is one already-RESOLVED envelope and the class a human would defend for it. Resolved
# means every live-state lookup has already happened, so these run with no cluster, no network, and
# the same answer on every run forever (see k8s-operator/internal/broker/classify/resolve.go).
#
# Read `expect.notRules` as carefully as `expect.rules`. The negative half is what catches an
# OVER-eager classifier, and an over-eager gate is not a safe failure -- it trains operators to
# approve without reading, which is how a gate stops being a control.
#
# BLOCK STYLE THROUGHOUT, no flow mappings. Two reasons, both learned the hard way. Prettier owns
# the formatting of this file and explodes a flow mapping that does not fit on one line into a
# nine-line tower, so a corpus written in flow style is unreadable after the first `prettier
# --write`. And the L0 chain installs no dependencies, so dev/tests/classifier-corpus-lint.py reads
# this file with a stdlib parser that accepts exactly the subset below -- anything fancier fails
# loudly there rather than being reinterpreted into something plausible.
#
# Defaults, so each case shows only what it varies:
#   caller     cluster-admin-1, scoped to proj/cluster-1
#   seen       true  (the action is familiar; novel-action does not fire)
#   undoPlan   true  (a plan exists; no-undo-plan does not fire)
#   objects    1
#
# Consumed by:
#   k8s-operator/internal/broker/classify/corpus_test.go   (runs every case)
#   dev/tests/classifier-corpus-lint.py                    (V-MET-005: coverage of the rule set)

cases:
  # ---------------------------------------------------------------------------------------------
  # A. The default. Ordinary work is routine, and most of the corpus's value is in proving that the
  #    gates stay quiet -- a classifier that gates everything passes every positive test.
  # ---------------------------------------------------------------------------------------------
  - id: gat-001
    description: patching a Deployment's replicas is routine
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      rules:
        - default-routine

  - id: gat-002
    description: applying a ConfigMap is routine
    ops:
      - verb: apply
        kind: ConfigMap
        namespace: team-a
        name: app-config
    expect:
      class: routine
      notRules:
        - secret-material-egress

  - id: gat-003
    description: scaling a Deployment is routine
    ops:
      - verb: scale
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine

  - id: gat-004
    description: creating a Service in a dev namespace is routine
    ops:
      - verb: create
        kind: Service
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - public-exposure

  - id: gat-005
    description: deleting a Deployment is routine -- disruptive, but the undo plan holds the spec
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - destructive-stateful-delete

  - id: gat-006
    description: creating a Job is routine
    ops:
      - verb: create
        group: batch
        kind: Job
        namespace: team-a
        name: migrate
    expect:
      class: routine

  - id: gat-007
    description: patching an HPA is routine
    ops:
      - verb: patch
        group: autoscaling
        kind: HorizontalPodAutoscaler
        namespace: team-a
        name: web
    expect:
      class: routine

  - id: gat-008
    description: a cloud write to an ordinary Config Connector kind is routine
    ops:
      - verb: cloud
        group: storage.cnrm.cloud.google.com
        kind: StorageBucket
        namespace: team-a
        name: assets
    expect:
      class: routine
      notRules:
        - identity-change

  # ---------------------------------------------------------------------------------------------
  # B. secret-write. Elevated, not gated: writing a Secret is ordinary operational work, it just
  #    deserves an immediate ping rather than a line in a digest nobody reads.
  # ---------------------------------------------------------------------------------------------
  - id: gat-010
    description: applying a Secret is elevated
    ops:
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
    expect:
      class: elevated
      rules:
        - secret-write

  - id: gat-011
    description: creating a Secret is elevated
    ops:
      - verb: create
        kind: Secret
        namespace: team-a
        name: api-key
    expect:
      class: elevated
      rules:
        - secret-write

  - id: gat-012
    description: patching a Secret is elevated
    ops:
      - verb: patch
        kind: Secret
        namespace: team-a
        name: db-creds
    expect:
      class: elevated
      rules:
        - secret-write

  - id: gat-013
    description: deleting a Secret gates -- the material is gone and no undo plan holds it
    ops:
      - verb: delete
        kind: Secret
        namespace: team-a
        name: db-creds
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
        - secret-write

  - id: gat-014
    description: patching a Deployment does not fire the Secret rule
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - secret-write

  # ---------------------------------------------------------------------------------------------
  # C. destructive-stateful-delete. The line is RECOVERABLE, not important: a Deployment delete is
  #    routine because the undo plan holds the spec; a PVC delete gates because no field in an undo
  #    plan contains a disk.
  # ---------------------------------------------------------------------------------------------
  - id: gat-020
    description: deleting a PersistentVolumeClaim gates
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-021
    description: deleting a PersistentVolume gates
    ops:
      - verb: delete
        kind: PersistentVolume
        name: pv-0001
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-022
    description: deleting a StatefulSet gates
    ops:
      - verb: delete
        group: apps
        kind: StatefulSet
        namespace: team-a
        name: postgres
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-023
    description: deleting a ConfigMap gates -- config is data someone hand-wrote
    ops:
      - verb: delete
        kind: ConfigMap
        namespace: team-a
        name: app-config
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-024
    description: deleting a Namespace gates
    ops:
      - verb: delete
        kind: Namespace
        name: team-a
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-025
    description: deleting a VolumeSnapshot gates
    ops:
      - verb: delete
        group: snapshot.storage.k8s.io
        kind: VolumeSnapshot
        namespace: team-a
        name: nightly
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  - id: gat-026
    description: PATCHING a StatefulSet does not fire the DELETE rule
    ops:
      - verb: patch
        group: apps
        kind: StatefulSet
        namespace: team-a
        name: postgres
    expect:
      class: routine
      notRules:
        - destructive-stateful-delete

  - id: gat-027
    description: creating a PVC does not fire the delete rule
    ops:
      - verb: create
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
    expect:
      class: routine
      notRules:
        - destructive-stateful-delete

  - id: gat-028
    description: deleting a ReplicaSet is routine -- it is generated, not authored
    ops:
      - verb: delete
        group: apps
        kind: ReplicaSet
        namespace: team-a
        name: web-7d9f
    expect:
      class: routine
      notRules:
        - destructive-stateful-delete

  # ---------------------------------------------------------------------------------------------
  # D. THE ASYMMETRY (V-GAT-010, V-GAT-021). Each control loosening and tightening, plus the mixed
  #    case. Same kind, same verb, opposite direction, different class -- 03 §5.2: "Agents are
  #    trusted to make things safer without asking, never to make them less safe."
  #
  #    `security-loosen` keys off the DIRECTION alone and carries no kind list, so these cases are
  #    also the coverage for every kind the direction analysis understands. See the rule's comment
  #    in floor.go for what the kind list cost when it was there.
  # ---------------------------------------------------------------------------------------------
  - id: gat-030
    description: "network-policy LOOSEN: deleting a NetworkPolicy gates"
    ops:
      - verb: delete
        group: networking.k8s.io
        kind: NetworkPolicy
        namespace: team-a
        name: default-deny
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-031
    description: "network-policy TIGHTEN: creating a NetworkPolicy is routine"
    ops:
      - verb: create
        group: networking.k8s.io
        kind: NetworkPolicy
        namespace: team-a
        name: default-deny
        direction: tighten
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-032
    description: "rbac LOOSEN: widening a ClusterRole gates"
    ops:
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: ClusterRole
        name: app-reader
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-033
    description: "rbac TIGHTEN: narrowing a ClusterRole is routine"
    ops:
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: ClusterRole
        name: app-reader
        direction: tighten
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-034
    description: "rbac LOOSEN: granting a new Role gates"
    ops:
      - verb: create
        group: rbac.authorization.k8s.io
        kind: Role
        namespace: team-a
        name: reader
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-035
    description: "admission-webhook LOOSEN: setting failurePolicy to Ignore gates"
    ops:
      - verb: patch
        group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: tenant-policy
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-036
    description: "admission-webhook TIGHTEN: setting failurePolicy to Fail is routine"
    ops:
      - verb: patch
        group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: tenant-policy
        direction: tighten
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-037
    description: "pod-security LOOSEN: dropping a Namespace's enforce level to privileged gates"
    ops:
      - verb: patch
        kind: Namespace
        name: team-a
        direction: loosen
        touchedPaths:
          - /metadata/labels/pod-security.kubernetes.io~1enforce
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-038
    description: "pod-security TIGHTEN: raising a Namespace's enforce level to restricted is routine"
    ops:
      - verb: patch
        kind: Namespace
        name: team-a
        direction: tighten
        touchedPaths:
          - /metadata/labels/pod-security.kubernetes.io~1enforce
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-039
    description: "security-context LOOSEN: privileged true on a Deployment gates"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        direction: loosen
        touchedPaths:
          - /spec/template/spec/containers/0/securityContext/privileged
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-040
    description: "security-context TIGHTEN: runAsNonRoot true on a Deployment is routine"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        direction: tighten
        touchedPaths:
          - /spec/template/spec/containers/0/securityContext/runAsNonRoot
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-041
    description: "authentication LOOSEN: repointing a workload's serviceAccountName gates"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        direction: loosen
        touchedPaths:
          - /spec/template/spec/serviceAccountName
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-042
    description: "authentication TIGHTEN: turning off automountServiceAccountToken is routine"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        direction: tighten
        touchedPaths:
          - /spec/template/spec/automountServiceAccountToken
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-043
    description: "resource-limits LOOSEN: deleting a ResourceQuota gates"
    ops:
      - verb: delete
        kind: ResourceQuota
        namespace: team-a
        name: compute
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-044
    description: "resource-limits TIGHTEN: creating a ResourceQuota is routine"
    ops:
      - verb: create
        kind: ResourceQuota
        namespace: team-a
        name: compute
        direction: tighten
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-045
    description: "service-exposure LOOSEN: ClusterIP to LoadBalancer gates"
    ops:
      - verb: patch
        kind: Service
        namespace: team-a
        name: web
        direction: loosen
        touchedPaths:
          - /spec/type
    expect:
      class: gated
      rules:
        - security-loosen
        - public-exposure

  - id: gat-046
    description: "service-exposure TIGHTEN: LoadBalancer to ClusterIP is routine"
    ops:
      - verb: patch
        kind: Service
        namespace: team-a
        name: web
        direction: tighten
        touchedPaths:
          - /spec/type
    expect:
      class: routine
      notRules:
        - security-loosen
        - public-exposure

  - id: gat-047
    description: >-
      MIXED: an operation whose direction analysis saw a tightening AND a loosening resolves to
      loosen and gates. The netting-out refusal of 03 §5.2 at the classifier's end of it -- an
      implementation that scored the two against each other would let any loosening be laundered by
      bundling a tightening alongside it.
    ops:
      - verb: apply
        group: networking.k8s.io
        kind: NetworkPolicy
        namespace: team-a
        name: app-policy
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen

  - id: gat-048
    description: a change with no computed direction does not fire the direction-scoped rule
    ops:
      - verb: patch
        group: networking.k8s.io
        kind: NetworkPolicy
        namespace: team-a
        name: default-deny
    expect:
      class: routine
      notRules:
        - security-loosen

  - id: gat-049
    description: "rbac LOOSEN on a RoleBinding gates on BOTH security-loosen and identity-change"
    ops:
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: RoleBinding
        namespace: team-a
        name: app-binding
        direction: loosen
    expect:
      class: gated
      rules:
        - security-loosen
        - identity-change

  # ---------------------------------------------------------------------------------------------
  # E. public-exposure. Its own rule alongside security-loosen, because the approver's question is
  #    different: "what can reach this now?" rather than "which control moved?".
  # ---------------------------------------------------------------------------------------------
  - id: gat-050
    description: creating an internet-facing Ingress gates
    ops:
      - verb: create
        group: networking.k8s.io
        kind: Ingress
        namespace: team-a
        name: web
        direction: loosen
    expect:
      class: gated
      rules:
        - public-exposure

  - id: gat-051
    description: creating a Gateway gates when it widens reachability
    ops:
      - verb: create
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: team-a
        name: edge
        direction: loosen
    expect:
      class: gated
      rules:
        - public-exposure

  - id: gat-052
    description: opening a ComputeFirewall gates
    ops:
      - verb: cloud
        group: compute.cnrm.cloud.google.com
        kind: ComputeFirewall
        namespace: team-a
        name: allow-web
        direction: loosen
    expect:
      class: gated
      rules:
        - public-exposure

  - id: gat-053
    description: deleting an Ingress narrows reachability and is routine
    ops:
      - verb: delete
        group: networking.k8s.io
        kind: Ingress
        namespace: team-a
        name: web
        direction: tighten
    expect:
      class: routine
      notRules:
        - public-exposure

  - id: gat-054
    description: a ConfigMap write is not an exposure change
    ops:
      - verb: apply
        kind: ConfigMap
        namespace: team-a
        name: app-config
    expect:
      class: routine
      notRules:
        - public-exposure

  # ---------------------------------------------------------------------------------------------
  # F. traffic-shift. Where live traffic goes is a gate regardless of direction: there is no "safe"
  #    direction for repointing production traffic.
  # ---------------------------------------------------------------------------------------------
  - id: gat-060
    description: changing a Service selector shifts traffic and gates
    ops:
      - verb: patch
        kind: Service
        namespace: team-a
        name: web
        touchedPaths:
          - /spec/selector
    expect:
      class: gated
      rules:
        - traffic-shift-production

  - id: gat-061
    description: changing Ingress rules shifts traffic and gates
    ops:
      - verb: patch
        group: networking.k8s.io
        kind: Ingress
        namespace: team-a
        name: web
        touchedPaths:
          - /spec/rules
    expect:
      class: gated
      rules:
        - traffic-shift-production

  - id: gat-062
    description: changing an HTTPRoute backendRefs gates
    ops:
      - verb: patch
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        namespace: team-a
        name: web
        touchedPaths:
          - /spec/backendRefs
    expect:
      class: gated
      rules:
        - traffic-shift-production

  - id: gat-063
    description: changing an Istio VirtualService route weight gates
    ops:
      - verb: patch
        group: networking.istio.io
        kind: VirtualService
        namespace: team-a
        name: web
        touchedPaths:
          - /spec/http/0/route/0/weight
    expect:
      class: gated
      rules:
        - traffic-shift-production

  - id: gat-064
    description: changing a Service's annotations does not shift traffic
    ops:
      - verb: patch
        kind: Service
        namespace: team-a
        name: web
        touchedPaths:
          - /metadata/annotations/note
    expect:
      class: routine
      notRules:
        - traffic-shift-production

  - id: gat-065
    description: changing a Service port is not a selector change
    ops:
      - verb: patch
        kind: Service
        namespace: team-a
        name: web
        touchedPaths:
          - /spec/ports/0/port
    expect:
      class: routine
      notRules:
        - traffic-shift-production

  - id: gat-066
    description: a Deployment patch cannot shift traffic, whatever it touches
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        touchedPaths:
          - /spec/selector
    expect:
      class: routine
      notRules:
        - traffic-shift-production

  # ---------------------------------------------------------------------------------------------
  # G. identity-change. Who something runs AS, distinct from what it may do.
  # ---------------------------------------------------------------------------------------------
  - id: gat-070
    description: creating a ServiceAccount gates
    ops:
      - verb: create
        kind: ServiceAccount
        namespace: team-a
        name: app
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-071
    description: patching a ClusterRoleBinding gates
    ops:
      - verb: patch
        group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
        name: app-admin
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-072
    description: creating an IAMPolicyMember gates
    ops:
      - verb: cloud
        group: iam.cnrm.cloud.google.com
        kind: IAMPolicyMember
        namespace: team-a
        name: app-sa-binding
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-073
    description: creating an IAMServiceAccount gates
    ops:
      - verb: cloud
        group: iam.cnrm.cloud.google.com
        kind: IAMServiceAccount
        namespace: team-a
        name: app-sa
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-074
    description: deleting a ServiceAccount gates
    ops:
      - verb: delete
        kind: ServiceAccount
        namespace: team-a
        name: app
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-075
    description: an IAMPartialPolicy write gates like an in-cluster identity change
    ops:
      - verb: cloud
        group: iam.cnrm.cloud.google.com
        kind: IAMPartialPolicy
        namespace: team-a
        name: bucket-access
    expect:
      class: gated
      rules:
        - identity-change

  - id: gat-076
    description: patching a Deployment is not an identity change
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - identity-change

  # ---------------------------------------------------------------------------------------------
  # H. cross-tier-direct-operation. GATES, never forbids: the cluster admin genuinely has the
  #    authority (V-6 admitted the child precisely because its scope is inside the parent's), so
  #    what is wrong is doing it silently.
  # ---------------------------------------------------------------------------------------------
  - id: gat-080
    description: a cluster admin patching a dev-team-owned Deployment gates
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        lowerTierOwner: dev-team-a
    expect:
      class: gated
      rules:
        - cross-tier-direct-operation

  - id: gat-081
    description: cross-tier gates rather than forbidding, so a human can still say yes
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        lowerTierOwner: dev-team-a
    expect:
      class: gated
      rules:
        - cross-tier-direct-operation

  - id: gat-082
    description: an object with no lower-tier owner does not fire the rule
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - cross-tier-direct-operation

  - id: gat-083
    description: a dev-team agent operating in its own namespace is not cross-tier
    caller:
      name: dev-team-a
      tier: developer-team
      project: proj
      cluster: cluster-1
      namespace: team-a
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - cross-tier-direct-operation

  - id: gat-084
    description: a platform agent writing to a cluster-admin-owned object gates
    caller:
      name: platform-1
      tier: platform
      project: proj
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        lowerTierOwner: cluster-admin-1
    expect:
      class: gated
      rules:
        - cross-tier-direct-operation

  # ---------------------------------------------------------------------------------------------
  # I. secret-material-egress. Digest match, never entropy. Excludes Secret targets: moving material
  #    between Secrets is `secret-write`, not egress.
  # ---------------------------------------------------------------------------------------------
  - id: gat-090
    description: writing Secret material into a ConfigMap gates
    ops:
      - verb: apply
        kind: ConfigMap
        namespace: team-a
        name: app-config
        secretMaterial:
          - namespace: team-a
            secret: db-creds
            key: password
            where: /data/DB_PASSWORD
            form: raw
    expect:
      class: gated
      rules:
        - secret-material-egress

  - id: gat-091
    description: base64-encoded Secret material in a ConfigMap still gates
    ops:
      - verb: apply
        kind: ConfigMap
        namespace: team-a
        name: app-config
        secretMaterial:
          - namespace: team-a
            secret: db-creds
            key: password
            where: /data/ENCODED
            form: base64
    expect:
      class: gated
      rules:
        - secret-material-egress

  - id: gat-092
    description: Secret material in a Deployment env var gates
    ops:
      - verb: apply
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        secretMaterial:
          - namespace: team-a
