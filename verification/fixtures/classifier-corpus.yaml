  # ---------------------------------------------------------------------------------------------
  # J. Blast radius (V-GAT-011). Three thresholds: >50 objects gates, >100 aborts, fraction >0.5
  #    aborts. An abort has NO approval path, which is why it is not simply a stricter class.
  # ---------------------------------------------------------------------------------------------
  - id: gat-100
    description: 1 object is routine
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        objects: 1
    expect:
      class: routine
      notRules:
        - blast-radius-cap

  - id: gat-101
    description: 50 objects is AT the threshold, not over it
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 50
    expect:
      class: routine
      notRules:
        - blast-radius-cap

  - id: gat-102
    description: 51 objects gates
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 51
    expect:
      class: gated
      rules:
        - blast-radius-cap

  - id: gat-103
    description: 100 objects gates but does not abort
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 100
    expect:
      class: gated
      rules:
        - blast-radius-cap
      abort: false

  - id: gat-104
    description: 101 objects aborts -- refused outright, no approval path
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 101
    expect:
      abort: true
      rules:
        - blast-radius-hard-cap

  - id: gat-105
    description: a fraction over 0.5 aborts even at a low object count
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 30
        fraction: 0.6
    expect:
      abort: true
      rules:
        - blast-radius-hard-cap

  - id: gat-106
    description: a fraction of exactly 0.5 does not abort
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 30
        fraction: 0.5
    expect:
      abort: false
      notRules:
        - blast-radius-hard-cap

  - id: gat-107
    description: an UNAVAILABLE denominator does not abort -- nil is not zero, and not "everything"
    ops:
      - verb: delete
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 10
    expect:
      class: routine
      abort: false
      notRules:
        - blast-radius-hard-cap

  - id: gat-108
    description: a large blast radius on a non-destructive verb still counts
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        objects: 75
    expect:
      class: gated
      rules:
        - blast-radius-cap

  - id: gat-109
    description: a 51-object Secret write gates on both blast radius and secret-write
    ops:
      - verb: apply
        kind: Secret
        namespace: team-a
        objects: 51
    expect:
      class: gated
      rules:
        - blast-radius-cap
        - secret-write

  # ---------------------------------------------------------------------------------------------
  # K. The production ladder. object canonical > object alias > namespace canonical > namespace
  #    alias, FIRST MATCH WINS, and a match is PRESENCE rather than "says production".
  # ---------------------------------------------------------------------------------------------
  - id: gat-110
    description: "rung 1: the object's kube-agents/environment escalates"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: production
    expect:
      class: elevated
      rules:
        - production-environment

  - id: gat-111
    description: "rung 2: the object's env alias escalates"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          env: production
    expect:
      class: elevated
      rules:
        - production-environment

  - id: gat-112
    description: "rung 3: the namespace's kube-agents/environment escalates"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: elevated
      rules:
        - production-environment

  - id: gat-113
    description: "rung 4: the namespace's env alias escalates"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        namespaceLabels:
          env: production
    expect:
      class: elevated
      rules:
        - production-environment

  - id: gat-114
    description: a staging OBJECT in a production namespace is staging -- the carve-out works
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: staging
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: routine
      notRules:
        - production-environment

  - id: gat-115
    description: the canonical key wins even when it disagrees with the alias
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: staging
          env: production
    expect:
      class: routine
      notRules:
        - production-environment

  - id: gat-116
    description: an empty-valued canonical label is PRESENT and stops the ladder
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: ""
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: routine
      notRules:
        - production-environment

  - id: gat-117
    description: "`Production` matches -- the comparison is case-insensitive after trim"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: Production
    expect:
      class: elevated
      rules:
        - production-environment

  - id: gat-118
    description: "`prod` is NOT accepted -- it is ambiguous with product and team names"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: prod
    expect:
      class: routine
      notRules:
        - production-environment

  - id: gat-119
    description: "`live` is not accepted either"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: live
    expect:
      class: routine
      notRules:
        - production-environment

  - id: gat-120
    description: "`nonprod` must not match production by substring"
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        liveLabels:
          kube-agents/environment: nonprod
    expect:
      class: routine
      notRules:
        - production-environment

  - id: gat-121
    description: production plus a gated rule stays gated -- the escalation caps
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
        - production-environment

  - id: gat-122
    description: production escalates a secret-write from elevated to gated
    ops:
      - verb: apply
        kind: Secret
        namespace: team-a
        name: db-creds
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - secret-write
        - production-environment

  # ---------------------------------------------------------------------------------------------
  # L. novel-action. Escalates by one, capped, and is about the (verb, kind, namespace) SHAPE --
  #    not the object. The twenty-first Deployment restart in a namespace is not novel.
  # ---------------------------------------------------------------------------------------------
  - id: gat-130
    description: a first-of-its-kind action escalates
    seen: false
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: elevated
      rules:
        - novel-action

  - id: gat-131
    description: a familiar action does not escalate
    seen: true
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
    expect:
      class: routine
      notRules:
        - novel-action

  - id: gat-132
    description: TWO escalations are not a +2 -- production plus novel on a routine action is elevated
    seen: false
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        namespaceLabels:
          env: production
    expect:
      class: elevated
      rules:
        - novel-action
        - production-environment

  - id: gat-133
    description: novel plus production plus a gated rule is still gated, never forbidden
    seen: false
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
        namespace: team-a
        name: data
        namespaceLabels:
          kube-agents/environment: production
    expect:
      class: gated
      rules:
        - destructive-stateful-delete

  # ---------------------------------------------------------------------------------------------
  # M. object-override. Raises only. An annotation saying `routine` on an action the floor gates is
  #    ignored -- otherwise it is a self-service exemption writable by anyone who can label a
