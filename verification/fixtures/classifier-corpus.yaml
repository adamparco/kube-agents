        namespace: team-a
        name: data
        override: routine
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
      notRules:
        - object-override

  - id: gat-143
    description: an object marked elevated does NOT lower a gated action
    ops:
      - verb: delete
        kind: PersistentVolumeClaim
