  - id: gat-140
    description: an object marked gated gates a routine action
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        override: gated
    expect:
      class: gated
      rules:
        - object-override

  - id: gat-141
