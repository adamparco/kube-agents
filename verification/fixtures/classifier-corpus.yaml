        name: data
        override: elevated
    expect:
      class: gated
      rules:
        - destructive-stateful-delete
      notRules:
        - object-override

  - id: gat-144
    description: a MALFORMED override gates rather than being ignored
    ops:
      - verb: patch
        group: apps
        kind: Deployment
        namespace: team-a
        name: web
        override: sort-of-important
    expect:
