"05§8#1":
  bullet: "**Two workloads per agent, and the four names:** for every `Agent` CR the controller reconciles a Deployment **`<agent>-gateway`** behind Service **`<agent>`**, bound to the **reader** SA, and a Deployment **`<agent>-broker`** behind a Service of the **same name**, bound to the **actor** SA — in the correct namespace, with `runAsNonRoot`, seccomp `RuntimeDefault`, `allowPrivilegeEscalation: false`, and — on the agent pod — no projected token with write RBAC. Assert all four names exactly; three of the four differ only by suffix and a wrong one fails silently as a Service with no endpoints."
  checks:
    - V-RUN-001
    - V-RUN-003
    - V-RUN-004

"05§8#2":
  bullet: "**Ports and transport:** the broker serves **HTTP+JSON** on `:8443` at `/v1alpha1/actions` (mTLS required, plaintext refused, gRPC absent); the agent serves the mesh on **`:8444`** at `/v1alpha1/mesh/{delegate,escalate}`; `:8081/healthz` and `:8081/readyz` are bound to the **pod IP** and answer a probe dialled from off-pod (a `127.0.0.1` bind here is a readiness outage that only appears under a real kubelet, so assert it with an off-pod request, not a `kubectl exec`)."
  checks:
    - V-BRK-007
    - V-BRK-021
    - V-RUN-010

"05§8#3":
