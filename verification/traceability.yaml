# Traceability matrix — V-MET-011.
#
# Every bullet of every Verification section in specs 01-08, mapped to the check IDs in
# `docs/design/09-verification-and-validation.md` §6 that actually assert it. 177 bullets across
# six sections: 02 §10 (26), 03 §11 (24), 04 §9 (23), 05 §8 (18), 06 §10 (65), 08 §7 (21).
#
# WHAT THIS FILE IS FOR. 09 §6 tells you what each check asserts. It does not tell you whether the
# specs' own stated obligations are covered — a spec can grow a Verification bullet that no check
# in the catalog addresses, and nothing about the catalog looks wrong afterward. This file is the
# other direction, and `dev/tests/spec-ids.py` fails the build if the two stop agreeing.
#
# IT IS CURATED, NOT GENERATED. Every mapping below was decided by reading the bullet against the
# catalog row. A mapping produced by text similarity would assert coverage nobody established,
# which is V-MET-014 ("a check that cannot fail") with extra steps — the matrix would be full, the
# lint would be green, and the question the file exists to answer would be unanswered. The one-shot
# script that laid down the initial 176 bullet texts was thrown away deliberately; there is nothing
# to re-run, and there must not be. The 177th arrived the way every later one should: the lint went
# red on an unmapped bullet, and a human read it and chose the checks.
#
# MULTIPLE IDs PER BULLET IS THE NORMAL CASE, because most bullets are conjunctions. 05 §8's first
# bullet asserts two workloads AND four names AND a hardened runtime, and those are V-RUN-001,
# V-RUN-003 and V-RUN-004. Listing only the closest one would be a claim that the other two clauses
# are verified when nothing verifies them. List every check that carries part of the load.
#
# THE KEY IS POSITIONAL: `<spec>§<section>#<n>`, n counting top-level `- ` bullets from 1. That is
# stable under rewording — the lint catches rewording separately, by comparing `bullet:` against
# the spec text — and deliberately unstable under REORDERING, which is the edit that would silently
# re-point a mapping at a different obligation. Reorder a Verification section and this file goes
# red; that is the feature.
#
# WHEN THE LINT FAILS, the fix is never to paste the new bullet text in. Re-read the bullet and
# re-decide which checks assert it. That is the whole content of this file.
#
# Schema (see `load_traceability` in dev/tests/spec-ids.py — strict, no PyYAML, because L0 installs
# no dependencies): one top-level key per bullet, a JSON-encoded `bullet:` scalar, and a block
# sequence of check IDs under `checks:`. Anything else is a parse error, not a reinterpretation.

"02§10#1":
  bullet: "**(carried) Cardinality:** exactly 1 `platform` agent per project, 1 `cluster-admin` per cluster, 1 `developer-team` per namespace (`kubectl get agents -l kube-agents/tier=…`). A second CR for the same `(tier, scope)` is rejected by the controller's cardinality webhook."
  checks:
    - V-CTN-015
    - V-CTN-016

"02§10#2":
  bullet: "**(new) Two workloads per CR:** every `Agent` CR reconciles both an agent pod (`kube-agents/role=reader`, reader SA) and a broker (`kube-agents/role=actor`, actor SA), each labelled with `tier`, `scope`, and `parent`; deleting either is reconciled back."
  checks:
    - V-RUN-001
    - V-RUN-004
    - V-RUN-009

"02§10#3":
  bullet: "**(new) Identity split per persona:** `kubectl auth can-i create|update|delete <any>` as any **reader** SA returns **no** universally; the broker resolves to the tier's **actor** SA ([03](03-security-model.md) §11)."
  checks:
    - V-CTN-004
    - V-RUN-002

"02§10#4":
  bullet: '**(inverted) Writes in scope succeed:** one representative routine action per tier executes end-to-end and yields an `ActionRecord` with a validated undo plan — Platform: apply a fleet policy object; Cluster Admin: resize a node pool; Developer Team: patch a Deployment''s limits. Replaces the old "no write verb anywhere" assertion.'
  checks:
    - V-CTN-002
    - V-REV-001

"02§10#5":
  bullet: "**(carried) Writes out of scope fail:** each tier's actor SA returns **no** on `create|update|patch|delete` for every out-of-scope target (another namespace, cluster, project), and the same envelope submitted to the broker is rejected before execution."
  checks:
    - V-CTN-003
    - V-BRK-002

"02§10#6":
  bullet: "**(new) The proactive loop remediates, not reports:** inject a defect per tier with **no human prompt** — Platform: version skew or a missing tenancy baseline; Cluster Admin: a namespace with no ResourceQuota; Developer Team: a CrashLoopBackOff from an undersized memory limit. Within the detection interval the defect is **fixed**, an `ActionRecord` exists, and the report carries an undo handle. A run producing a recommendation, ticket, OKF entry, or PR instead **fails**."
  checks:
    - V-PRO-001

"02§10#7":
  bullet: "**(new) No permission-seeking on routine work:** across a scripted set of in-scope, reversible, below-threshold requests, the reply contains no confirmation question and the action is already executed."
  checks:
    - V-PRO-002
    - V-CHR-002
    - V-CHR-009

"02§10#8":
  bullet: '**(inverted) Direct calls exist and are constrained:** an agent can open a mesh connection to its `parentRef` and its direct children, and **cannot** reach a sibling, grandparent, grandchild, or any agent outside its lineage (NetworkPolicy denies). Replaces "no agent may connect to any other agent".'
  checks:
    - V-MSH-001
    - V-MSH-008

"02§10#9":
  bullet: "**(new) Delegation re-authorizes rather than inherits:** a parent delegates an action that is out of the callee's scope, or forbidden, or `gated` for the callee — the callee **refuses** or **gates** it, no `ActionRecord` is created under the caller's authority, and the caller cannot approve it."
  checks:
    - V-MSH-002
    - V-GAT-005

"02§10#10":
  bullet: "**(new) Attribution without authority:** an accepted delegated action's `ActionRecord` names the **callee's** actor identity as executor and the caller as requesting principal, with the scope check performed against the callee's scope."
  checks:
    - V-MSH-003

"02§10#11":
  bullet: "**(new) Refusal, timeout, paused:** a refused call returns a structured reason and re-submitting the same intent in a different shape is rate-limited and alerted; a call to an unreachable or paused callee returns within its deadline and the caller **continues other work** rather than blocking ([05](05-system-architecture.md) §8); a paused callee's block is reported, not routed around. A call carrying a trace ID already in its chain is refused."
  checks:
    - V-MSH-004
    - V-MSH-005
    - V-MSH-006

"02§10#12":
