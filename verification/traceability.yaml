"08§7#1":
  bullet: "**(new) Two workloads, and no more.** For each `Agent` CR, exactly one `<agent>-gateway` and one `<agent>-broker` Deployment exist, both with an `OwnerReference` to the CR; the controller creates no third workload and no ServiceAccount. Deleting the CR removes both and leaves both SAs intact."
  checks:
    - V-RUN-001
    - V-RUN-009

"08§7#2":
  bullet: "**(new) Names and ports are the canonical ones.** Deployments `<agent>-gateway` and `<agent>-broker`; Services `<agent>` on `8444` (mesh) and `<agent>-broker` on `8443` (envelope); the broker answers `POST /v1alpha1/actions` over HTTP+JSON and serves no gRPC reflection service (§2.1, §2.3). Cross-check against [06](06-api-and-data-contracts.md) §4.1 and §7 from the same fixture, so a divergence fails rather than being resolved by whichever doc the reader opened."
  checks:
    - V-RUN-001
    - V-BRK-021
    - V-CTR-008

"08§7#3":
  bullet: "**(new) The launch seam is pair-atomic.** With the broker's launch forced to fail (bad image ref, or the Scion probe returning unavailable), assert that **no agent pod is created**, any partial broker objects are removed, and the CR reports `BrokerReady: False` with `Ready: False` (§2.6). Run this against **both** `PodLauncher` implementations, native and Scion-gated."
  checks:
    - V-RUN-005
    - V-RUN-001

"08§7#4":
  bullet: "**(new) Correct identity on each.** The agent Deployment's `spec.serviceAccountName` is the `<tier>-agent` reader SA; the broker Deployment's is the `<tier>-<scope>-actor` actor SA. Neither is settable to the other's value (admission rejects)."
  checks:
    - V-RUN-002

"08§7#5":
  bullet: "**(carried) Cardinality:** a second `Agent` CR for the same `(tier, scope)` is **rejected** by the controller's validating webhook. A developer-team `Agent` whose `metadata.namespace` differs from `spec.scope.namespace` is rejected."
  checks:
    - V-CTN-015
    - V-CTN-016

"08§7#6":
  bullet: "**(new) Ceiling webhook:** a parent provisioning a child whose scope is not a strict subset of its own is rejected ([03](03-security-model.md) §4.2)."
  checks:
    - V-CTN-013

"08§7#7":
  bullet: "**(carried) Hardened runtime:** both pod templates assert non-root, seccomp `RuntimeDefault`, no privilege escalation; the broker additionally asserts a read-only root filesystem and no extra volume mounts; `runtimeClassName` (where set) is validated and surfaces `Degraded` when the class is absent."
  checks:
    - V-RUN-003
    - V-RUN-010

"08§7#8":
  bullet: "**(inverted) The agent SA can write nothing.** Sweep `kubectl auth can-i <verb> <resource>` as the **reader** SA across `create|update|patch|delete|deletecollection|escalate|bind|impersonate` × a representative resource set (including `*`/`*`, cluster and namespace scoped, in-scope and out-of-scope): **every** answer is `no`. Reads return `yes` only inside the tier scope."
  checks:
    - V-CTN-004

"08§7#9":
  bullet: "**(new) The broker SA can write only its tier template, within scope.** As the **actor** SA, `create|update|patch|delete` returns `yes` for templated resources inside the scope and `no` for every out-of-scope target, every non-templated resource, and every forbidden-set object ([03](03-security-model.md) §3.3)."
  checks:
    - V-CTN-002
    - V-CTN-003
    - V-CTR-004

"08§7#10":
  bullet: "**(carried) The controller mints no RBAC.** Its `ClusterRole` contains no verb on `roles`/`clusterroles`/`rolebindings`/`clusterrolebindings`/`serviceaccounts` beyond `get;list;watch` on ServiceAccounts (assert by parsing the generated RBAC, not by inspection); the agent SAs, their RBAC, and their WI bindings exist only as pre-created manifests in the repo (grep + audit-log check that no runtime principal created them)."
  checks:
    - V-CTN-017

"08§7#11":
  bullet: "**(new) The controller holds nothing cluster-wide that can create a pod.** Parse the generated RBAC: no `ClusterRole` bound by a `ClusterRoleBinding` to the controller's SA carries `create|update|patch|delete` on `pods`, `deployments`, `secrets`, `services`, `networkpolicies`, `configmaps`, or `persistentvolumeclaims` (§2.7). Then prove it live: as the controller's SA, `kubectl auth can-i create deployments -n <a namespace with no agent bundle>` returns **no**, and creating a pod there fails. This is the G-5 check — a `ClusterRoleBinding` here silently voids the §4 compromised-controller bound, so it is asserted statically **and** dynamically."
  checks:
    - V-CTN-017

"08§7#12":
  bullet: "**(new) The controller cannot read Secrets.** As the controller's SA, `kubectl auth can-i get|list|watch secrets` returns **no** in every namespace, including `kubeagents-system` and every placement namespace (§2.7). It must still be able to create/update its own `broker-tls` / `agent-mesh-tls` Secrets."
  checks:
    - V-CTN-017

"08§7#13":
  bullet: "**(new) All five labels are stamped and selectable** — `kube-agents/role`, `/agent`, `/tier`, `/scope`, `/parent` (§2.5). `kubectl get pods -l kube-agents/role=reader` returns exactly the agent pods; `-l kube-agents/role=actor` exactly the brokers; `-l kube-agents/agent=<name>` returns exactly that CR's pair; `kube-agents/tier`, `kube-agents/scope`, and `kube-agents/parent` carry the derived values, and the scope label is a valid DNS-safe label value for a maximally long scope."
  checks:
    - V-RUN-004
    - V-RUN-011

"08§7#14":
  bullet: "**(new) The role label is enforced, not decorative.** A pod carrying `kube-agents/role: reader` but binding an actor SA (and the converse) is **rejected by `vap-agent-pod-hardening`**."
  checks:
    - V-CTN-014

"08§7#15":
  bullet: "**(new) Labels are not the whole bound.** A pod that carries a perfectly consistent label set and binds an actor SA, but has **no `OwnerReference` chain to that SA's `Agent` CR** or does **not** run the broker image, is still rejected ([03](03-security-model.md) §4.3). Run this test with the pod created by a principal impersonating the controller, since that is the threat it exists for."
  checks:
    - V-CTN-032
    - V-CTN-014

"08§7#16":
  bullet: "**(new) Fail closed on broker loss.** Scale the broker Deployment to zero, then ask the agent to perform a routine in-scope change. It must: report the broker as unavailable, keep the item queued, and attempt **no** direct API write (assert from the audit log — zero write attempts by the reader identity). Restore the broker; the change then executes and journals normally."
  checks:
    - V-RUN-006
    - V-ISO-005

"08§7#17":
  bullet: "**(new) Startup ordering is safe.** (a) Create an `Agent` and delay the broker's image pull: the agent pod starts in observe-and-report mode after the init-container timeout and does not crash- loop. (b) Start the broker first with no agent: it serves `/healthz`, initiates nothing, and logs no envelopes. (c) `Ready` on the CR requires both `AgentReady` and `BrokerReady`."
  checks:
    - V-RUN-005

