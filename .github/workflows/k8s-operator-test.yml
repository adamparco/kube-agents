name: Operator Tests

# Runs on EVERY branch push, not only `main`. A phase branch accumulates dozens of CHECKPOINT
# commits before its PR opens; with a main-only push trigger this job ran once per phase, against
# all of them at once, and the red it found belonged to a commit twenty back (LSN-055). The
# `paths-filter` step below keeps the cost of the wider trigger near zero for non-operator pushes.
# `binding.md` §Branching pins the other half — a push at every CHECKPOINT — and
# `dev/tests/invariants-gate.py` asserts the pair, because either half alone is still one CI run.
on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Controller Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            operator:
              - "k8s-operator/**"
              - ".github/workflows/k8s-operator-test.yml"

      - name: Set up Go
        if: steps.filter.outputs.operator == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: "k8s-operator/go.mod"
          cache: true
          cache-dependency-path: "k8s-operator/go.sum"

      - name: Run Tests
        if: steps.filter.outputs.operator == 'true'
        run: make -C k8s-operator test
