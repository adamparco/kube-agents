name: Operator Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Controller Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            operator:
              - "k8s-operator/**"
              - "agents/platform/scripts/**"
              - ".github/workflows/k8s-operator-test.yml"

      - name: Set up Go
        if: steps.filter.outputs.operator == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "k8s-operator/go.mod"
          cache: true
          cache-dependency-path: "k8s-operator/go.sum"

      # The deployment targets apply the committed manifests rather than
      # regenerating them, so nothing at deploy time would notice config/
      # drifting from the API types. Catch it here instead.
      #
      # The manifests diff is byte-equality against prettier-formatted output,
      # so the prettier version is pinned: a new release that changes YAML
      # formatting would otherwise fail this gate on every operator PR until
      # someone commits a reformat. Keep the pin in lockstep with prettier.yml.
      #
      # The api/ diff runs `generate` but ignores the licence-header year,
      # which `generate` stamps from the current date (YEAR ?= $(shell date
      # +%Y)) — without -I this step would fail every operator PR from
      # 1 January onward on output that is not stale. Nothing else checks
      # committed deepcopy: `make test` regenerates before compiling, so a
      # stale DeepCopyInto that still compiles is invisible to the test job.
      #
      # git add --intent-to-add makes untracked files (a newly generated CRD
      # for a new API type) visible to git diff, which reports tracked files
      # only.
      - name: Verify generated manifests are up to date
        if: steps.filter.outputs.operator == 'true'
        run: |
          npm install -g prettier@3.9.6
          make -C k8s-operator manifests
          git add --intent-to-add -A -- k8s-operator/config
          if ! git diff --exit-code -- k8s-operator/config; then
            echo "::error::Committed manifests are out of date, or your local prettier differs from the version this gate pins above. Run 'make -C k8s-operator manifests' with that prettier version and commit the result."
            exit 1
          fi
          make -C k8s-operator generate
          git add --intent-to-add -A -- k8s-operator/api
          if ! git diff --exit-code -I'Copyright [0-9]{4}\.' -- k8s-operator/api; then
            echo "::error::Generated deepcopy is out of date. Run 'make -C k8s-operator generate' and commit the result."
            exit 1
          fi

      # The LiteLLM overlays are rendered by `kustomize build | envsubst` with a
      # hand-maintained variable allowlist per provider. A placeholder added to a
      # manifest but not to its allowlist survives into the cluster as the
      # literal string "${VAR}" — which `kubectl apply` accepts, so it fails as
      # confusing runtime behaviour rather than a failed deploy. Nothing else
      # catches it: no test builds these overlays, and the deploy targets need a
      # live cluster. This renders through the same LITELLM_RENDER the deploy
      # target uses, so it cannot drift from what actually ships.
      - name: Verify LiteLLM overlays render cleanly
        if: steps.filter.outputs.operator == 'true'
        env:
          NAMESPACE: kubeagents-system
          PROJECT_ID: ci-project
          VERTEX_PROJECT: ci-vertex-project
          VERTEX_LOCATION: global
          LITELLM_KSA_NAME: kubeagents-litellm
          LITELLM_GSA_NAME: kubeagents-litellm-gsa
        run: |
          # Load-bearing warm-up, not a stray line: the renders below are captured
          # into a shell variable, and the first `make` to need kustomize prints
          # "Downloading ..." to stdout, which would land in the middle of the
          # manifest stream. `|| true` keeps a transient download failure from
          # being reported here as a render failure — print-litellm-manifests
          # declares kustomize as a prerequisite, so a real one still fails inside
          # the captured make.
          make -s -C k8s-operator kustomize >/dev/null 2>&1 || true

          fail=0
          for provider in gemini anthropic chatgpt openai vertex_ai; do
            if ! out=$(MODEL_PROVIDER="$provider" MODEL_DEFAULT_NAME=ci-model \
                       make -s -C k8s-operator print-litellm-manifests); then
              echo "::error::MODEL_PROVIDER=$provider failed to render."
              fail=1
              continue
            fi
            # Both spellings of a placeholder: ${VAR} and the bare $VAR, which
            # envsubst leaves alone just as silently. No rendered manifest holds a
            # legitimate dollar sign in any provider today, and envsubst has no
            # escape syntax ($$VAR expands, it does not quote), so a manifest that
            # ever needs a literal one has to teach this gate about it.
            if printf '%s\n' "$out" | grep -nE '\$\{|\$[A-Za-z_]'; then
              echo "::error::MODEL_PROVIDER=$provider left unsubstituted placeholders (listed above). Add the variable to that provider's envsubst allowlist in k8s-operator/Makefile."
              fail=1
            fi
            # Psych rather than PyYAML: the runner image ships Ruby and does not
            # ship PyYAML, so parsing costs no install step. parse_stream reads
            # every document without constructing objects, which is all that is
            # being asked here.
            if ! printf '%s\n' "$out" | ruby -ryaml -e 'Psych.parse_stream(STDIN.read)'; then
              echo "::error::MODEL_PROVIDER=$provider rendered a stream that is not valid YAML."
              fail=1
            fi
          done

          # The vertex variables are guarded on deploy-litellm only — undeploy and
          # this print target render deliberately unguarded — so empty values stay
          # reachable. They must not yield a stream kubectl cannot read: before
          # the interpolated values were given fallbacks, an empty LITELLM_GSA_NAME
          # rendered the service-account annotation as a plain scalar opening with
          # `@`, a reserved YAML indicator that makes the whole document
          # unparseable rather than merely wrong. Refusing to render is a fine
          # answer and so is rendering something that still parses; emitting
          # broken YAML is not.
          if empty_out=$(PROJECT_ID= VERTEX_PROJECT= VERTEX_LOCATION= \
                         LITELLM_KSA_NAME= LITELLM_GSA_NAME= \
                         MODEL_PROVIDER=vertex_ai MODEL_DEFAULT_NAME=ci-model \
                         make -s -C k8s-operator print-litellm-manifests); then
            if ! printf '%s\n' "$empty_out" | ruby -ryaml -e 'Psych.parse_stream(STDIN.read)'; then
              echo "::error::The vertex overlay renders unparseable YAML when its variables are empty. Quote or default the values it interpolates."
              fail=1
            fi
          else
            echo "vertex_ai refuses to render with empty variables — a loud failure, which is an acceptable answer here."
          fi

          exit $fail

      - name: Run Tests
        if: steps.filter.outputs.operator == 'true'
        run: make -C k8s-operator test
