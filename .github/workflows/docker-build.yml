name: Docker Build

# Build-only validation for every image the publish workflows push. The set here and the set in
# docker-publish-ghcr.yml / docker-publish-k8s-operator.yml must match: an image whose first build
# happens on main, after merge, has no PR that could have caught it breaking. That is how
# cluster-admin-agent, developer-team-agent and kage-router reached Phase 8 with Dockerfile targets
# that nothing ever built. dev/test_image_provenance.py (V-CMP-002) asserts the two sets are equal,
# which is what caught kage-broker being added to the publish workflow and not to this one.
#
# The tiers all derive FROM agent-base, so they share one gha cache scope and the expensive Hermes
# layer is built once per run rather than once per tier. Tags are :ci -- these are never pushed, and
# naming them :latest made a local throwaway look like the registry tag this repo no longer ships.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load tags
        # Only the KEY=value lines. $GITHUB_ENV is not a shell and not a make include: it rejects a
        # comment line outright ("Invalid format"), so `cat` worked only while tags.env was a single
        # bare assignment. It has three consumers with three different grammars -- this one, `include
        # tags.env` in the Makefile, and `. ./tags.env` in shell -- and the file must satisfy all
        # three. dev/test_image_provenance.py asserts exactly that.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tags.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Platform Agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          push: false
          cache-from: type=gha,scope=agent-base
          cache-to: type=gha,mode=max,scope=agent-base
          tags: platform-agent:ci
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build Cluster-Admin Agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cluster-admin
          push: false
          cache-from: type=gha,scope=agent-base
          tags: cluster-admin-agent:ci
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build Developer-Team Agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: developer-team
          push: false
          cache-from: type=gha,scope=agent-base
          tags: developer-team-agent:ci
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build Credential Sidecar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          push: false
          cache-from: type=gha,scope=agent-base
          tags: credential-proxy:ci
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build Controller
        uses: docker/build-push-action@v7
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile
          push: false
          cache-from: type=gha,scope=k8s-operator
          cache-to: type=gha,mode=max,scope=k8s-operator
          tags: k8s-operator:ci

      - name: Build kage-router
        uses: docker/build-push-action@v7
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile.router
          push: false
          cache-from: type=gha,scope=k8s-operator
          tags: kage-router:ci

      - name: Build kage-broker
        uses: docker/build-push-action@v7
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile.broker
          push: false
          cache-from: type=gha,scope=k8s-operator
          tags: kage-broker:ci

      - name: Build Replay Proxy
        uses: docker/build-push-action@v7
        with:
          context: examples/inference-replay/replay-proxy
          push: false
          tags: replay-proxy:ci
