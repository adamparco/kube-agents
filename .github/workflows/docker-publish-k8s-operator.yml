name: Publish Controller to GHCR

# Same two-trigger, immutable-only tag scheme as docker-publish-ghcr.yml -- see the comment there.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-controller-ghcr:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load tags
        # Only the KEY=value lines. $GITHUB_ENV is not a shell and not a make include: it rejects a
        # comment line outright ("Invalid format"), so `cat` worked only while tags.env was a single
        # bare assignment. It has three consumers with three different grammars -- this one, `include
        # tags.env` in the Makefile, and `. ./tags.env` in shell -- and the file must satisfy all
        # three. dev/test_image_provenance.py asserts exactly that.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tags.env >> "$GITHUB_ENV"

      - name: Resolve image tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$KAGE_IMAGE_VERSION" ]; then
              echo "::error::git tag $REF_NAME does not match KAGE_IMAGE_VERSION=$KAGE_IMAGE_VERSION in tags.env. Bump tags.env in the commit you are tagging."
              exit 1
            fi
            echo "KAGE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "KAGE_TAG=$SHA" >> "$GITHUB_ENV"
          fi

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Controller Image
        uses: docker/build-push-action@v7
        id: build-controller
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha,scope=k8s-operator
          cache-to: type=gha,mode=max,scope=k8s-operator
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/k8s-operator:${{ env.KAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The kage-router is C15, the read-only ChatOps front door. config/router/kustomization.yaml
      # has pinned ghcr.io/gke-labs/kube-agents/kage-router:v0.1.0 since Phase 6 and no workflow has
      # ever built it -- the Dockerfile was written, the kustomize base shipped, and the image never
      # existed. It builds from the k8s-operator context like the controller does, just a different
      # entrypoint (cmd/router), so it belongs in this workflow and shares the module cache.
      - name: Build and Push kage-router Image
        uses: docker/build-push-action@v7
        id: build-router
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile.router
          push: true
          provenance: false
          cache-from: type=gha,scope=k8s-operator
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/kage-router:${{ env.KAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The kage-broker is the Action Broker (03 §4.1, 08 §2.3): the third Go binary from this same
      # context, and the one whose ServiceAccount can write. It is built here rather than anywhere
      # else so that the operator, the router and the broker are always published together at one
      # tag -- an install running k8s-operator:T beside a broker from an earlier tag is an install
      # where the process holding the write credential is not the one this tree describes.
      - name: Build and Push kage-broker Image
        uses: docker/build-push-action@v7
        id: build-broker
        with:
          context: k8s-operator
          file: k8s-operator/Dockerfile.broker
          push: true
          provenance: false
          cache-from: type=gha,scope=k8s-operator
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/kage-broker:${{ env.KAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the images
        run: |
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/k8s-operator@${{ steps.build-controller.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/kage-router@${{ steps.build-router.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/kage-broker@${{ steps.build-broker.outputs.digest }}"
