name: Publish to GHCR

# Two triggers, two kinds of tag, both immutable:
#   push to main  -> :${github.sha}       every commit is addressable, nothing is overwritten
#   push of v*    -> :${github.ref_name}  the release tag, written exactly once
# There is deliberately no :latest. Every manifest in this repo pins an exact tag and says so
# ("pinned to an immutable version tag (not :latest)"); a moving tag in a shared registry would
# make each of those comments false and make a rollback un-addressable. V-CMP-002
# (local-dev/test_image_provenance.py) fails the build if a publish step reintroduces one, or if
# any manifest pins a tag no workflow here produces.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load tags
        # Only the KEY=value lines. $GITHUB_ENV is not a shell and not a make include: it rejects a
        # comment line outright ("Invalid format"), so `cat` worked only while tags.env was a single
        # bare assignment. It has three consumers with three different grammars -- this one, `include
        # tags.env` in the Makefile, and `. ./tags.env` in shell -- and the file must satisfy all
        # three. local-dev/test_image_provenance.py asserts exactly that.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tags.env >> "$GITHUB_ENV"

      - name: Resolve image tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # A release tag must agree with tags.env, or the version a user pins and the version
            # actually published silently diverge -- the exact failure V-CMP-002 exists to prevent,
            # just relocated from the tree to the registry.
            if [ "$REF_NAME" != "$KAGE_IMAGE_VERSION" ]; then
              echo "::error::git tag $REF_NAME does not match KAGE_IMAGE_VERSION=$KAGE_IMAGE_VERSION in tags.env. Bump tags.env in the commit you are tagging."
              exit 1
            fi
            echo "KAGE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "KAGE_TAG=$SHA" >> "$GITHUB_ENV"
          fi

      - name: Downcase repository name
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_REPOSITORY=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Platform Agent (GHCR)
        uses: docker/build-push-action@v7
        id: build-platform
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: platform
          push: true
          cache-from: type=gha,scope=agent-base
          cache-to: type=gha,mode=max,scope=agent-base
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent:${{ env.KAGE_TAG }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      # The cluster-admin and developer-team tiers each ship their own persona baked into their own
      # image (07 section 2(a)), and the operator defaults every Agent CR of that tier to these
      # exact names (manifest_helpers.go). Both Dockerfile targets have existed since the tiers did;
      # neither was ever published, so every non-platform Agent CR resolved to an image that does
      # not exist. That is LSN-007 -- built, tested, and unreachable.
      - name: Build and Push Cluster-Admin Agent (GHCR)
        uses: docker/build-push-action@v7
        id: build-cluster-admin
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cluster-admin
          push: true
          cache-from: type=gha,scope=agent-base
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/cluster-admin-agent:${{ env.KAGE_TAG }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build and Push Developer-Team Agent (GHCR)
        uses: docker/build-push-action@v7
        id: build-developer-team
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: developer-team
          push: true
          cache-from: type=gha,scope=agent-base
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/developer-team-agent:${{ env.KAGE_TAG }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Build and Push Replay Proxy (GHCR)
        uses: docker/build-push-action@v7
        id: build-replay-proxy
        with:
          context: examples/inference-replay/replay-proxy
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy:${{ env.KAGE_TAG }}

      - name: Build and Push Credential Sidecar (GHCR)
        uses: docker/build-push-action@v7
        id: build-credential-proxy
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: credential-proxy
          push: true
          cache-from: type=gha,scope=agent-base
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy:${{ env.KAGE_TAG }}
          build-args: |
            HERMES_AGENT_TAG=${{ env.HERMES_AGENT_TAG }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the images
        run: |
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/platform-agent@${{ steps.build-platform.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/cluster-admin-agent@${{ steps.build-cluster-admin.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/developer-team-agent@${{ steps.build-developer-team.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/replay-proxy@${{ steps.build-replay-proxy.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ env.IMAGE_REPOSITORY }}/credential-proxy@${{ steps.build-credential-proxy.outputs.digest }}"
