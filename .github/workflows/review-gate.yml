name: Review Gate

# Security review-gate (06 §7): the agent-driven review-security-k8s-* suite runs on every PR that
# touches a security-relevant path (and a daily heartbeat re-run), a hermetic scorer turns the JSON
# findings into the merge decision. CI is authoritative and runs outside the agent (decision R-A);
# an unmitigated high/critical finding fails this job. See docs/build/phase-5.md + docs/design/06 §7.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # THIS LIST IS A DEFINITION SITE, AND IT IS CHECKED. `dev/test_review_gate_paths.py`
    # (V-MET-007) derives the repository's security surface — Go files carrying a
    # `+kubebuilder:rbac`/`:webhook` marker or building a `tls.Config`/`TokenReview`/
    # `SubjectAccessReview`, plus every manifest declaring an authority-granting kind — and fails
    # if any derived file is not matched below. The check is one-directional: it can tell you a
    # glob is MISSING, never that one is unnecessary, because over-triggering costs CI minutes and
    # under-triggering costs a review. So when it goes red, add a glob; a glob it does not require
    # is a judgement call, and the ones here that the derivation does not name are marked.
    paths:
      - "**/provisioning/**"
      - "**/agents/**"
      - "**/namespaces/**"
      - "**/policy/**"
      - "**/SOUL.md"
      - ".agents/skills/review-security-k8s-**"
      - "security-review-waivers.yaml"
      - "scripts/review-gate/**"
      - ".github/workflows/review-gate.yml"
      # The security surface stopped being manifests in Phase 9. Everything below was added
      # because the derivation named a file under it and nothing above matched — see
      # `verification/results.csv`, V-MET-007, 2026-07-27 (the finding) and 2026-07-30 (the fix).
      - "k8s-operator/internal/**" # broker, webhook, controller, router, eventingress
      - "k8s-operator/cmd/**" # the broker and operator entrypoints
      - "k8s-operator/config/**" # RBAC, webhook, VAP, router manifests
      - "k8s-operator/test/**" # the L2 suites that assert the negatives
      - "examples/**" # NetworkPolicies and RBAC overlays people apply verbatim
      # A test-only RBAC grant is still a grant, and V-CTN-037's whole premise is that this is the
      # one directory it is allowed to live in — so it is also the one directory where a change to
      # it must be reviewed. A directory glob, not the filename: nothing outside `dev/` may name a
      # file holding a test-only grant, and this workflow is outside `dev/`.
      - "dev/verify/fixtures/**" # the read-only actor tenant overlay (V-CTN-037)
      # Not named by the derivation — judgement, in the over-trigger direction:
      - "k8s-operator/api/**" # the CRD types every webhook validates against
      - "deploy/**" # shipped defaults and the image build context
  schedule:
    - cron: "17 7 * * *" # daily heartbeat re-run (off the top-of-hour stampede)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-gate:
    name: Security review gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scorer self-test (the gate's own correctness)
        run: |
          python3 scripts/review-gate/test_score_findings.py
          python3 scripts/review-gate/test_extract_findings.py

      - name: Run agent-driven detector (headless; skips loudly on fork / no secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/review-gate/run-detector.sh findings.json

      - name: Score findings (authoritative merge decision)
        run: python3 scripts/review-gate/score_findings.py --waivers security-review-waivers.yaml findings.json
