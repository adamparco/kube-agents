name: Publish to GCP Artifact Registry

# Same two-trigger, immutable-only tag scheme as docker-publish-ghcr.yml -- see the comment there.
# The GAR mirror publishes the same image set as GHCR, or "fall back to the GAR copy" quietly means
# "fall back to a copy missing three of the seven images".
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish-gcp:
    runs-on: ubuntu-latest
    if: github.repository == 'gke-labs/kube-agents'
    permissions:
      contents: read
      id-token: write
    env:
      GCP_REGISTRY: us-docker.pkg.dev/kube-agents-prow/kube-agents
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load tags
        # Only the KEY=value lines. $GITHUB_ENV is not a shell and not a make include: it rejects a
        # comment line outright ("Invalid format"), so `cat` worked only while tags.env was a single
        # bare assignment. It has three consumers with three different grammars -- this one, `include
        # tags.env` in the Makefile, and `. ./tags.env` in shell -- and the file must satisfy all
        # three. dev/test_image_provenance.py asserts exactly that.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tags.env >> "$GITHUB_ENV"

      - name: Resolve image tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$KAGE_IMAGE_VERSION" ]; then
              echo "::error::git tag $REF_NAME does not match KAGE_IMAGE_VERSION=$KAGE_IMAGE_VERSION in tags.env. Bump tags.env in the commit you are tagging."
              exit 1
            fi
            echo "KAGE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "KAGE_TAG=$SHA" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/125393897113/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@kube-agents-prow.iam.gserviceaccount.com

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and Push Agent Tiers + Credential Sidecar (GCP Cloud Build)
        id: gcp-agents
        run: |
          set -euo pipefail
          for spec in platform:platform-agent cluster-admin:cluster-admin-agent developer-team:developer-team-agent credential-proxy:credential-proxy; do
            target="${spec%%:*}"; name="${spec##*:}"
            echo ">>> $name"
            gcloud builds submit \
              --config=deploy/docker/cloudbuild.yaml \
              --substitutions="_IMAGE_URI=${GCP_REGISTRY}/${name}:${KAGE_TAG},_CACHE_URI=${GCP_REGISTRY}/${name}:buildcache,_TARGET=${target},_HERMES_AGENT_TAG=${HERMES_AGENT_TAG}" \
              .
            digest=$(gcloud artifacts docker images describe "${GCP_REGISTRY}/${name}:${KAGE_TAG}" --format="value(image_summary.digest)")
            echo "${name}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Build and Push Controller + kage-router (GCP Cloud Build)
        id: gcp-operator
        run: |
          set -euo pipefail
          for spec in k8s-operator:k8s-operator/Dockerfile kage-router:k8s-operator/Dockerfile.router; do
            name="${spec%%:*}"; dockerfile="${spec##*:}"
            echo ">>> $name"
            gcloud builds submit \
              --config=deploy/docker/cloudbuild.yaml \
              --substitutions="_IMAGE_URI=${GCP_REGISTRY}/${name}:${KAGE_TAG},_CACHE_URI=${GCP_REGISTRY}/${name}:buildcache,_CONTEXT=k8s-operator,_DOCKERFILE=${dockerfile}" \
              .
            digest=$(gcloud artifacts docker images describe "${GCP_REGISTRY}/${name}:${KAGE_TAG}" --format="value(image_summary.digest)")
            echo "${name}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Build and Push Replay Proxy (GCP Cloud Build)
        id: gcp-replay-proxy
        run: |
          set -euo pipefail
          gcloud builds submit examples/inference-replay/replay-proxy \
            --tag="${GCP_REGISTRY}/replay-proxy:${KAGE_TAG}"
          digest=$(gcloud artifacts docker images describe "${GCP_REGISTRY}/replay-proxy:${KAGE_TAG}" --format="value(image_summary.digest)")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the images
        run: |
          set -euo pipefail
          cosign sign --yes "${GCP_REGISTRY}/platform-agent@${{ steps.gcp-agents.outputs.platform-agent }}"
          cosign sign --yes "${GCP_REGISTRY}/cluster-admin-agent@${{ steps.gcp-agents.outputs.cluster-admin-agent }}"
          cosign sign --yes "${GCP_REGISTRY}/developer-team-agent@${{ steps.gcp-agents.outputs.developer-team-agent }}"
          cosign sign --yes "${GCP_REGISTRY}/credential-proxy@${{ steps.gcp-agents.outputs.credential-proxy }}"
          cosign sign --yes "${GCP_REGISTRY}/k8s-operator@${{ steps.gcp-operator.outputs.k8s-operator }}"
          cosign sign --yes "${GCP_REGISTRY}/kage-router@${{ steps.gcp-operator.outputs.kage-router }}"
          cosign sign --yes "${GCP_REGISTRY}/replay-proxy@${{ steps.gcp-replay-proxy.outputs.digest }}"
