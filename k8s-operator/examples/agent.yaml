apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: Agent
metadata:
  name: agent
  namespace: kubeagents-system
  labels:
    kube-agents/tier: platform
spec:
  # Persona / containment level (06 §1.1). Immutable after creation. Defaults to platform.
  tier: platform
  # Harness configures the core execution environment and framework-level settings.
  # +optional
  harness:
    # ClusterName is the logical name of the cluster where the agent is running.
    # +optional
    clusterName: "cluster-a"
    # Location is the geographical location or cloud region.
    # +optional
    location: "us-central1-a"
    # Hermes configures the internal event-routing or agent framework.
    # +optional
    hermes:
      # DashboardEnabled toggles the PLATFORM_AGENT_DASHBOARD environment variable.
      # Default: true
      # +optional
      dashboardEnabled: true
      # PluginsDebug toggles the PLATFORM_AGENT_PLUGINS_DEBUG environment variable.
      # Default: false
      # +optional
      pluginsDebug: false
      # ApiServerSecretRef securely references a Secret containing the API_SERVER_KEY.
      # +optional
      apiServerSecretRef:
        name: "agent-secrets"
        key: "api-key"
  # Deployment abstracts the Kubernetes Pod/Deployment configuration,
  # decoupling the compute payload from the agent's application logic.
  # +optional
  deployment:
    image: "ghcr.io/gke-labs/kube-agents/platform-agent"
    # Pinned to an immutable version tag (not :latest); repin to a digest in production.
    tag: "v0.1.0"
    imagePullPolicy: "IfNotPresent"
  security:
    serviceAccountName: "kubeagents-platform-agent"
    # WorkloadIdentity maps external IAM to the KSA securely.
    # +optional
    serviceAccountAnnotations:
      iam.gke.io/gcp-service-account: "kubeagents-platform-gsa@kube-agents-gkedemos.iam.gserviceaccount.com"

  # Integration configures platform-specific external connections.
  # +optional
  integration:
    # GoogleChat configures the Google Chat integration.
    # +optional
    googleChat:
      # Enabled toggles the Google Chat integration.
      # Default: false
      # +optional
      enabled: true
      # Mode controls output verbosity in Google Chat ("default" or "debug").
      # Default: "default"
      # +optional
      mode: "default"
      # ProjectID is the target GCP Project ID for Pub/Sub. Required if enabled.
      # +optional
      projectId: "kube-agents-gkedemos"
      # TopicName is the GCP Chat Topic Name. Required if enabled.
      # +optional
      topicName: "kubeagents-google-chat-events"
      # SubscriptionName is the GCP Chat Subscription Name. Required if enabled.
      # +optional
      subscriptionName: "kubeagents-google-chat-events-sub"
      # AllowedUsers is the CLOSED human allowlist (A4): only these members may reach the agent.
      # An empty or absent list means ALL users are allowed — never ship that. Replace the
      # placeholder with your platform team's Google Chat member IDs.
      # +optional
      allowedUsers:
        - "users/REPLACE_WITH_PLATFORM_ADMIN_ID"
    # Slack configures the Slack integration.
    # +optional
    slack:
      # Enabled toggles the Slack integration.
      # Default: false
      # +optional
      enabled: false
      # BotToken is the Slack bot token (xoxb-...).
      # +optional
      botToken: ""
      # AppToken is the Slack app token for Socket Mode (xapp-...).
      # +optional
      appToken: ""
      # AllowedUsers is a list of allowed member IDs.
      # +optional
      allowedUsers: []
      # HomeChannel is the default channel ID for scheduled messages.
      # +optional
      homeChannel: ""
      # HomeChannelName is the human-readable channel name.
      # +optional
      homeChannelName: ""
