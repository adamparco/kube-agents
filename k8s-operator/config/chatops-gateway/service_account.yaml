# The ChatOps gateway (docs/designs/broker/chat-approval.md §3) and the approval notifier (§2)
# share this one identity, one Deployment, one pod (see deployment.yaml).
#
# The name is spelled out literally rather than relying on config/default's `namePrefix:
# kubeagents-` transform, and this directory is deliberately NOT one of config/default's
# resources: the VAP (config/policy/vap-agent-scope-journal.yaml) already hardcodes the exact
# principal `system:serviceaccount:kubeagents-system:kube-agents-chatops-gateway` -- a name the
# `kubeagents-` prefix would turn into `kubeagents-kube-agents-chatops-gateway` if this manifest
# went through the same kustomization the operator's own resources do. Keeping this module's
# manifests in their own directory, outside config/default's transform, is the same isolation
# this branch keeps at the Go-package level (docs/designs/broker/README.md) applied to config/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-agents-chatops-gateway
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-chatops-gateway
    app.kubernetes.io/component: chatops-gateway
