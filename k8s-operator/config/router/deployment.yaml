apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: system
  labels:
    app.kubernetes.io/name: kube-agents-operator
    app.kubernetes.io/component: kage-router
    app.kubernetes.io/managed-by: kustomize
spec:
  # Single replica: the inbound puller relies on Pub/Sub at-least-once delivery, not leader election, so
  # the router needs no lease RBAC. Scaling out would require leader election to keep one active puller.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-agents-operator
      app.kubernetes.io/component: kage-router
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: router
      labels:
        app.kubernetes.io/name: kube-agents-operator
        app.kubernetes.io/component: kage-router
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          # Pinned to an immutable version tag (not :latest). In production, repin to a
          # content-addressable digest (kage-router@sha256:...) once the image is published.
          image: kage-router:v0.1.0
          command:
            - /router
          args:
            - --health-probe-bind-address=:8081
          env:
            # Deliberately EMPTY, not a REPLACE_WITH_* placeholder (V-CMP-003). Both are set by
            # provision_03 step 5 (`kubectl set env`), which either wires them to the real project +
            # subscription or parks this Deployment at 0 replicas when no chat platform is configured.
            #
            # Empty is not laziness, it is the better failure. The router treats unset and empty
            # identically and exits with "missing required --project-id / KAGE_PROJECT_ID"
            # (cmd/router/main.go:71) — an error that names the variable to set. A placeholder value
            # is syntactically valid, so it flows all the way into the Pub/Sub client and surfaces
            # instead as `credentials: could not find default credentials`, which sends the reader
            # to look for a missing service-account key that was never the problem. That is not
            # hypothetical: it is what the local dev cluster's router had been reporting across 414
            # CrashLoopBackOff restarts when P8-T4 found it.
            - name: KAGE_PROJECT_ID
              value: ""
            - name: KAGE_INBOUND_SUBSCRIPTION
              value: ""
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      serviceAccountName: router
      terminationGracePeriodSeconds: 10
