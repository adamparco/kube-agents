apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kube-agents-operator
    app.kubernetes.io/component: kage-router
    app.kubernetes.io/managed-by: kustomize
  name: router-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: router-role
subjects:
  - kind: ServiceAccount
    name: router
    namespace: system
