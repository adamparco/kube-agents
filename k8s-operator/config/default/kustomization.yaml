# Adds namespace to all resources.
namespace: kubeagents-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: kubeagents-

resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../certmanager
  # The mesh CA (08 §2.3). Separate from ../certmanager, which is the webhook's own self-signed
  # serving cert: that issuer is namespaced and signs one certificate for one Service, while this
  # one is cluster-scoped and signs a leaf for every agent in the fleet. Folding them together
  # would put the mesh root in the operator's namespace under a name that reads like a webhook
  # detail.
  - ../mesh-ca
  - ../router

patches:
  - path: webhookcainjection_patch.yaml

replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      fieldPath: metadata.name
    targets:
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 0
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 1
