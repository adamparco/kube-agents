# Adds namespace to all resources.
namespace: kubeagents-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: kubeagents-

resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../certmanager
  # The mesh CA (08 §2.3) is NOT here. It used to be, and it could not survive the two transformers
  # above it: `namePrefix: kubeagents-` renamed a ClusterIssuer that is already spelled
  # `kubeagents-mesh-ca` into `kubeagents-kubeagents-mesh-ca`, which is not the name
  # `meshCAIssuerName` in internal/controller/mesh_trust.go asks every agent Certificate to be
  # signed by; and `namespace: kubeagents-system` moved the CA Certificate out of `cert-manager`,
  # which is the one namespace a ClusterIssuer resolves its CA Secret from. It is applied
  # untransformed from `config/install` instead. See dev/tests/install-render-is-faithful.py.
  - ../router

patches:
  - path: webhookcainjection_patch.yaml

replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: metadata.name
    targets:
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 0
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 1
