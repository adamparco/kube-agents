# C-BR, the brake surface (05 §1.5, 04 §5.1 rung 5).
#
# Its OWN ServiceAccount, deliberately not the operator's, even though the reconciler is a
# controller like the journal exporter is. 06 §4.3 gives the two disjoint authority over
# `ActionRecord.status` -- the exporter may write `exported` and nothing else, C-BR may write the
# fulfilment half of `escalation` and nothing else -- and `vap-agent-scope-journal` enforces both on
# the request USERNAME. One process is one ServiceAccount, so running C-BR inside the operator
# manager would have needed one identity holding the union, and the exporter's write is what unlocks
# deletion of the record: that identity could write the receipt for an escalation and then destroy
# the thing it is a receipt for. `cmd/controllers.go` refuses the combination at parse time so this
# stays a property of the binary and not of the manifest.
#
# `namePrefix: kubeagents-` in config/default renders this as `kubeagents-brake-controller` in
# `kubeagents-system`, which is the literal `vap-agent-scope-journal`'s `isBrakeController` matches.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: kube-agents-operator
    app.kubernetes.io/component: brake-controller
    app.kubernetes.io/managed-by: kustomize
  name: brake-controller
  namespace: system
