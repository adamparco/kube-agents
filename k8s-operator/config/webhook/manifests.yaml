---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /mutate-kubeagents-x-k8s-io-v1alpha1-platformagent
    failurePolicy: Fail
    name: mplatformagent.kb.io
    rules:
      - apiGroups:
          - kubeagents.x-k8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - platformagents
    sideEffects: None
