resources:
  - ../../base
  - serviceaccount.yaml

patches:
  - path: deployment-patch.yaml

# Replaces the base's generated config so the model entries carry
# vertex_project/vertex_location.
#
# The generated name stays hashed, but do not read anything into that: kustomize
# hashes this file before envsubst substitutes it, so the hash is the same for
# every VERTEX_PROJECT and every model. What rolls the pods is the
# checksum/config annotation the Makefile stamps into the pod template.
configMapGenerator:
  - name: litellm-config
    behavior: replace
    files:
      - config.yaml

# Repeated from the base so serviceaccount.yaml, which the base cannot see, is
# labelled too.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize
