resources:
  - ../../base
  - serviceaccount.yaml

patches:
  - path: deployment-patch.yaml

# Replaces the base's generated config so the model entries carry
# vertex_project/vertex_location.
#
# `behavior: replace` matches on the name, so this entry has to repeat the
# base's content-addressed name and its disabled suffix hash verbatim; see
# ../../base/kustomization.yaml for why the name is built that way. The
# checksum the Makefile computes is taken over *this* file when the provider is
# vertex_ai, so VERTEX_PROJECT and VERTEX_LOCATION move the name too.
configMapGenerator:
  - name: litellm-config-${LITELLM_CONFIG_CHECKSUM}
    behavior: replace
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true

# Repeated from the base so serviceaccount.yaml, which the base cannot see, is
# labelled too.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/part-of: kube-agents
      app.kubernetes.io/managed-by: kustomize
