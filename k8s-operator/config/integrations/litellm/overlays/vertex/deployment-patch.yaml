apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  template:
    metadata:
      annotations:
        # The GSA this pod borrows through Workload Identity, mirrored from the
        # ServiceAccount's iam.gke.io/gcp-service-account. Recorded here because
        # nothing else in the pod template names it: re-rendering with a
        # different PROJECT_ID or LITELLM_GSA_NAME rewrites only the
        # ServiceAccount annotation, leaving the Deployment byte-identical, so
        # nothing rolls. The running pods can then go on minting tokens for the
        # old GSA — the GKE metadata server caches the KSA->GSA mapping it
        # resolved for them — and a redeploy that looks clean quietly serves the
        # old identity. Mirroring the email into the pod template makes the
        # identity part of what a change rolls. It is a record, not a switch: the
        # binding itself is the ServiceAccount annotation plus the IAM policy
        # provision_04_gcp_iam.sh writes.
        kubeagents.x-k8s.io/vertex-gsa: ${LITELLM_GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
    spec:
      serviceAccountName: ${LITELLM_KSA_NAME}
      containers:
        - name: litellm-container
          # Functional, not decorative: LiteLLM falls back to these for any
          # model whose litellm_params omit vertex_project/vertex_location. The
          # generated config sets both explicitly on every entry, so today they
          # are only the backstop for a hand-edited ConfigMap — which is a
          # documented way to change providers — and they make the pod's Vertex
          # target readable in `kubectl describe`. Both are rendered from the
          # same envsubst variables as the ConfigMap, so the two cannot disagree
          # within a render. Do not delete them as redundant.
          env:
            - name: VERTEXAI_PROJECT
              value: ${VERTEX_PROJECT}
            - name: VERTEXAI_LOCATION
              value: ${VERTEX_LOCATION}
