# Vertex AI authenticates with Application Default Credentials, not an API key,
# so the LiteLLM pod needs an identity of its own. Every other provider leaves
# the Deployment on the namespace `default` service account; only this overlay
# binds one, which is why the ServiceAccount lives here and not in the base.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${LITELLM_KSA_NAME}
  annotations:
    iam.gke.io/gcp-service-account: ${LITELLM_GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
