apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  template:
    metadata:
      annotations:
        # The GSA this pod borrows through Workload Identity, mirrored from the
        # ServiceAccount's iam.gke.io/gcp-service-account annotation. Recorded
        # here because nothing else in the pod template names it: re-rendering
        # with a different PROJECT_ID or LITELLM_GSA_NAME rewrites only the
        # ServiceAccount annotation, leaving the Deployment byte-identical, so
        # nothing rolls and the running pods keep minting tokens for the old
        # GSA (the GKE metadata server caches the KSA->GSA mapping it resolved
        # for them). Mirroring the email makes the identity part of what a
        # change rolls. It is a record, not a switch: the binding itself is the
        # ServiceAccount annotation plus the IAM policy provision_04 writes.
        kubeagents.x-k8s.io/vertex-gsa: ${LITELLM_GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
    spec:
      serviceAccountName: ${LITELLM_KSA_NAME}
      containers:
        - name: litellm-container
          env:
            # Without these LiteLLM falls back to ADC — the node's project —
            # and bills the wrong one, or 404s for a model served elsewhere.
            - name: VERTEXAI_PROJECT
              value: "${VERTEX_PROJECT_ID}"
            - name: VERTEXAI_LOCATION
              value: "${VERTEX_LOCATION}"
