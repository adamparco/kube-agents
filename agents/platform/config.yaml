# MCP Servers configuration.
mcp_servers:
  platform_control:
    command: "/opt/hermes/.venv/bin/python3"
    args:
      - "/opt/data/scripts/platform_mcp_server.py"
    connect_timeout: 120
    # 5-minute timeout to support long GKE reasoning chains
    timeout: 300
    env:
      KUBERNETES_SERVICE_HOST: "${KUBERNETES_SERVICE_HOST}"
      KUBERNETES_SERVICE_PORT: "${KUBERNETES_SERVICE_PORT}"
      HERMES_HOME: "${HERMES_HOME}"
      GOOGLE_CHAT_PROJECT_ID: "${GOOGLE_CHAT_PROJECT_ID}"
      GOOGLE_CHAT_SUBSCRIPTION_NAME: "${GOOGLE_CHAT_SUBSCRIPTION_NAME}"
      API_SERVER_KEY: "${API_SERVER_KEY}"
      # platform_mcp_server.py resolves the session-KV database from this, and
      # its code default happens to equal the value the operator sets on the
      # container, so leaving it undeclared has been harmless. Declared so the
      # two cannot drift apart in silence: the child receives only what this
      # block names, so if the operator's path ever moves, an undeclared
      # variable would leave the server reading a database nothing writes.
      SESSION_KV_DB_PATH: "${SESSION_KV_DB_PATH}"
  # A remote MCP endpoint, proxied over stdio by mcp-remote. The explicit
  # timeout is a backstop: unpatched, mcp-remote drops the request id when the
  # remote answers non-2xx, so the client parks for the whole 300s default.
  # deploy/docker/patches/apply_mcp_remote_forward_errors.py fixes that at build
  # time and carries the full analysis; this bounds the damage if it ever stops
  # applying. Healthy calls to this endpoint measure 0.47-0.48s.
  gke:
    command: "node"
    args:
      - "/opt/mcp-remote/dist/proxy.js"
      - "https://container.googleapis.com/mcp"
    connect_timeout: 30
    timeout: 60

# Explicitly list platform_toolsets
# platform_toolsets is a reserved framework key in Hermes.
#
# These lists are UNIONED with the shared defaults', not replaced —
# deploy/docker/merge_configs.py merges two lists as
# `list(dict.fromkeys(a + b))`. So an entry removed here but left in
# deploy/shared/defaults/config.yaml comes back at image build. Both copies of
# `mcp-agent_common` had to go; see the note above that file's `mcp_servers`.
platform_toolsets:
  cli:
    - hermes-cli
    - mcp-platform_control
    - mcp-developer_knowledge
    - mcp-gke
  api_server:
    - hermes-api-server
    - mcp-platform_control
    - mcp-developer_knowledge
    - mcp-gke

# Top-level `toolsets` gates the kanban orchestrator surface: the kanban tools
# live in the core pool (surfaced via hermes-cli/hermes-api-server), and their
# check_fn requires "kanban" here for a non-worker (orchestrator) profile. This
# lets the Platform Agent create/route kanban cards for delegation. (Workers get
# the kanban tools automatically via HERMES_KANBAN_TASK.) It does not restrict
# any other tools.
toolsets:
  - kanban

# Per-turn tool-calling iteration budget. Hermes defaults to 90, which the fleet
# audits outgrow: the cost audit runs ten checks against every cluster and the
# drift audit nineteen, plus enumeration, the SOP read, and the publish harness.
# Three separate runs died on `Iteration budget exhausted (90/90)` — reported as
# a `timed_out` kanban event, though the run was actively heartbeating and no
# clock ran out. 250 is roughly triple the observed near-miss.
#
# This belongs here rather than in the operator's generated root config because
# an audit only ever runs as a kanban worker, and a worker is spawned with
# HERMES_HOME pinned to the profile — so it reads *this* config.yaml, not the
# root one. Scoping it here leaves the Chat Agent and the per-cluster Cluster
# Agents on the default 90, where nothing has ever approached the ceiling. The
# cron entries that file those cards are `no_agent` scripts and prompt no model,
# so there is nowhere else this budget could be set.
agent:
  max_turns: 250

# No memory provider. `multiuser_memory` keys its per-user store off the gateway
# identity (agent._user_id), which only the Chat Agent has — the Platform Agent is
# reached through the kanban dispatcher, which spawns workers with no human
# identity attached, so every write here landed in one anonymous `default` bucket.
# Per-user memory lives on the front door only (see agents/chat/config.yaml); the
# Platform Agent receives the resolved facts inline in each kanban card body.
memory:
  memory_enabled: false
  user_profile_enabled: false

# The Platform Agent is no longer the chat ingress (the Chat Agent / `default`
# profile owns that), so the session_store / session_otel_bridge ingress plugins
# move to the Chat Agent. Keep otel for observability parity and tool_call_audit
# to audit this privileged specialist's tool calls.
plugins:
  enabled:
    - hermes_otel
    - tool_call_audit
    - incident_context
