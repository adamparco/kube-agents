# Platform tier — pre-created read-only identity (06 §2, 03 §4).
# Project-scoped read-only. The controller REFERENCES this SA (serviceAccountName); it never mints
# RBAC (08 §4). The `kube-agents/tier` label is the selector the ValidatingAdmissionPolicy uses.
# Verbs are read-only (get/list/watch) — a write verb here would be rejected by vap-agent-readonly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-agent
  namespace: kubeagents-system
  labels:
    kube-agents/tier: platform
    app.kubernetes.io/managed-by: gitops
  annotations:
    # Workload Identity: binds this KSA to the VIEWER-ONLY cloud GSA (06 §2; provisioned by
    # k8s-operator/scripts/provision_04_gcp_iam.sh, hardened to read-only in P1-T9). The GSA holds
    # only viewer cloud IAM — the cloud-write path is a reviewed GitOps PR, never the agent process.
    # Substituted per project by CI/CD; PROJECT_ID = your GCP project ID.
    iam.gke.io/gcp-service-account: "kubeagents-platform-gsa@PROJECT_ID.iam.gserviceaccount.com"
---
# Cluster-wide read ("explorer") — get/list/watch only, no write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-agent-explorer
  labels:
    kube-agents/tier: platform
rules:
  - apiGroups:
      ["", "apps", "batch", "networking.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # CustomResourceDefinitions read: the platform agent reasons over IaC/KCC CRD types when proposing
  # changes. This preserves the CRD read the controller's minted explorer role granted before P1-T4
  # removed runtime RBAC-minting — do not drop it, or the cutover silently loses CRD visibility.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-agent-explorer
  labels:
    kube-agents/tier: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-agent-explorer
subjects:
  - kind: ServiceAccount
    name: platform-agent
    namespace: kubeagents-system
