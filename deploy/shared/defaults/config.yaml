model:
  provider: custom
  model: model-default
  default: model-default
  base_url: http://litellm.kubeagents-system.svc.cluster.local/v1
  api_key: none

# MCP Servers configuration.
#
# `agent_common` (the `call_agent` A2A tool) was declared here and is not any
# more. It could not work in this deployment and never had: the agent container
# holds API_SERVER_KEY="cluster-internal-trusted", the non-secret loopback
# sentinel, while the Service URL the tool targets
# (https://platform-agent…:8642) forwards to the credential sidecar's plaintext
# agent-API listener on 8643, which authenticates against the real
# API_SERVER_EXTERNAL_KEY it alone holds. So the request failed the TLS
# handshake, and would have been refused as unauthenticated had it completed.
# Making it work would mean putting the external key in the agent container,
# collapsing a split the operator's own tests pin.
#
# Removed rather than repaired for the reason `ask_agent` was removed before it
# (agents/chat/config.yaml, and renderConfigYAML in the operator): a
# synchronous cross-agent call blocks up to 300s with no visible progress.
# Delegation here is kanban-only. agent_common_server.py stays on disk —
# platform_mcp_server.py and session_kv_server.py import helpers from it — so
# only the tool surface is gone.
mcp_servers:
  # Remote MCP endpoints, proxied over stdio by mcp-remote. The explicit
  # timeouts are a backstop: unpatched, mcp-remote drops the request id when the
  # remote answers non-2xx, so the client parks for the whole 300s default.
  # deploy/docker/patches/apply_mcp_remote_forward_errors.py fixes that at build
  # time and carries the full analysis; this bounds the damage if it ever stops
  # applying. Healthy calls to these endpoints measure 0.47-0.48s.
  # `lazy: true`: register tools from the per-profile schema cache without
  # spawning the node proxy; the child starts on first actual tool call. Kanban
  # workers are fresh processes per card, and the eager spawns were ~2-4s of
  # every worker's boot — paid even when no MCP tool was ever called. See the
  # fuller note in agents/platform/config.yaml; a cold cache falls back to an
  # eager connect and warms itself.
  developer_knowledge:
    command: "node"
    args:
      - "/opt/mcp-remote/dist/proxy.js"
      - "https://developerknowledge.googleapis.com/mcp"
    lazy: true
    connect_timeout: 30
    timeout: 60
  gke:
    command: "node"
    args:
      - "/opt/mcp-remote/dist/proxy.js"
      - "https://container.googleapis.com/mcp"
    lazy: true
    connect_timeout: 30
    timeout: 60

# Explicitly list platform_toolsets to bypass the upstream Hermes CLI/API loader prefix mapping bug.
# platform_toolsets is a reserved framework key in Hermes. Other reserved top-level keys
# in config.yaml include: mcp_servers, model, agent, context, memory, and provider_routing.
# Upstream resolves config-based MCP toolsets with a leading "mcp-" prefix, but filters them out
# using raw names (e.g., "developer_knowledge"). Pre-declaring "mcp-developer_knowledge" here
# acts as an explicit passthrough that bypasses the filter and loads the tools natively on boot.
platform_toolsets:
  cli:
    - hermes-cli
    - mcp-developer_knowledge
    - mcp-gke
  api_server:
    - hermes-api-server
    - mcp-developer_knowledge
    - mcp-gke

# Turn off Hermes' Python-toolchain probe. It is both wrong here and expensive.
#
# Wrong: on the common path it publishes "Python toolchain: python3=missing,
# pip=missing, uv=installed." into the system prompt while python3 is present at
# 3.13.5 — observed verbatim in 20 live platform sessions. Even when it reports
# accurately it is telling an agent in an immutable sandbox about a pip it must
# never use and a venv it must never create.
#
# Expensive: the probe spawns four Python interpreters per session to discover
# that fixed state, and agent/system_prompt.py blocks the prompt build on the
# result for up to 10s. Under gVisor, where a bare interpreter start measures
# ~1s, that is the single largest avoidable item on the cold-start path, and
# kanban pays it again for every card.
#
# agent/agent_init.py reads this key (default True) and agent/system_prompt.py
# gates the prompt line on it. Set on every profile that ships a config: this
# file feeds only the platform template, because the Chat Agent and Cluster
# Agent configs are copied verbatim rather than merged (see deploy/docker/Dockerfile).
agent:
  environment_probe: false

# Approval settings. Allow dangerous commands to execute autonomously in cron watchdogs.
approvals:
  cron_mode: approve

# Enable DuckDuckGo web search
web:
  backend: "ddgs"
