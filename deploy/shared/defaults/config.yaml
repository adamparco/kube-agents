model:
  provider: custom
  model: model-default
  default: model-default
  base_url: http://litellm.kubeagents-system.svc.cluster.local/v1
  api_key: none

# MCP Servers configuration.
mcp_servers:
  agent_common:
    command: "/opt/hermes/.venv/bin/python3"
    args:
      - "/opt/data/scripts/agent_common_server.py"
  # Bridged with the pod's own Workload Identity token, NOT an OAuth flow. The previous
  # `node /opt/mcp-remote/dist/proxy.js` wanted a browser and a loopback redirect, neither of
  # which exists in a pod, so it hung on startup instead of failing (Phase 8 P8-T4). The
  # timeouts are explicit for the same reason: an MCP server that never answers is worse than
  # one that is absent, because it is indistinguishable from one that is still starting.
  developer_knowledge:
    command: "/opt/hermes/.venv/bin/python3"
    args:
      - "/opt/data/scripts/mcp_http_bridge.py"
      - "https://developerknowledge.googleapis.com/mcp"
    connect_timeout: 30
    timeout: 120
  # NOTE: the cluster-mutating `gke` remote MCP proxy (container.googleapis.com) is intentionally
  # omitted so agents are read-only (03 §4, 06 §9). The operator's renderConfigYAML() is
  # runtime-authoritative and also omits it; this shared default must stay in sync. Provisioning
  # goes through the apply-change skill (an Action Envelope the broker executes), never a direct
  # cluster write from this pod.

# Explicitly list platform_toolsets to bypass the upstream Hermes CLI/API loader prefix mapping bug.
# platform_toolsets is a reserved framework key in Hermes. Other reserved top-level keys
# in config.yaml include: mcp_servers, model, agent, context, memory, and provider_routing.
# Upstream resolves config-based MCP toolsets with a leading "mcp-" prefix, but filters them out
# using raw names (e.g., "developer_knowledge"). Pre-declaring "mcp-developer_knowledge" here
# acts as an explicit passthrough that bypasses the filter and loads the tools natively on boot.
platform_toolsets:
  cli:
    - hermes-cli
    - mcp-agent_common
    - mcp-developer_knowledge
  api_server:
    - hermes-api-server
    - mcp-agent_common
    - mcp-developer_knowledge

# Approval settings. Allow dangerous commands to execute autonomously in cron watchdogs.
approvals:
  cron_mode: approve

# Enable DuckDuckGo web search
web:
  backend: "ddgs"
